*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  row.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatEl.appendChild(row); scrollBottom();
  setTimeout(function(){ row.remove(); cb(); }, delay || 550);
}
function addBot(html, buttons){
  var row = document.createElement('div');
  row.className='row bot';
  var btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = '<div class="quick">'+buttons.map(function(b,i){
      return '<button class="qbtn '+(b.cls||'')+'" data-i="'+i+'">'+esc(b.label)+'</button>';
    }).join('')+'</div>';
  }
  row.innerHTML = '<div class="stack"><div class="bubble">'+html+'</div>'+(btnHtml?'<div style="margin-top:6px">'+btnHtml+'</div>':'')+'</div>';
  chatEl.appendChild(row);
  if(buttons && buttons.length){
    var nodes = row.querySelectorAll('.qbtn');
    for(var i=0;i<nodes.length;i++){
      (function(node, b){ node.addEventListener('click', function(){ b.fn(); }); })(nodes[i], buttons[i]);
    }
  }
  scrollBottom();
}
function addBotText(text, buttons, delay){ showTyping(function(){ addBot(md(text), buttons); }, delay); }

function waOpen(text){ window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(text), '_blank'); }

/* ============ MENU ============ */
function mainMenuButtons(){
  var m = t('menu');
  return [
    {label:m[0], fn:startFlow, cls:'primary'},
    {label:m[1], fn:showSvc},
    {label:m[2], fn:showInfo},
    {label:m[3], fn:humanHandoff, cls:'wa'}
  ];
}
function backBtn(){ return {label:'⬅️ '+t('menuLabel'), fn:showMenu}; }
function bookBtn(){ return {label:t('menu')[0], fn:startFlow, cls:'primary'}; }
function showMenu(){ addBotText(t('welcome'), mainMenuButtons(), 300); }

/* ============ SERVICES / CARTE ============ */
function svcCardHtml(){
  var body = '';
  t('svcCats').forEach(function(c){
    body += '<div class="spec-row"><span class="spec">'+esc(c.label)+'</span></div>';
    c.items.forEach(function(it){
      body += '<div class="dish"><div class="dname">'+esc(it.n)+'</div><div class="ddesc">'+esc(it.d)+'</div></div>';
    });
  });
  return '<div class="card"><div class="cardhead"><span class="cname">'+esc(t('svcCardTitle'))+'</span></div>'+
    '<div class="cardbody">'+body+'<div class="demo-note">ℹ️ '+esc(t('demoNote'))+'</div></div></div>';
}
function showSvc(){
  addUser(t('menu')[1]);
  addBotText(t('svcIntro'), null, 400);
  setTimeout(function(){
    var row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = '<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">'+svcCardHtml()+'</div>';
    chatEl.appendChild(row); scrollBottom();
    var lbl = t('svcButtonsLabels');
    addBot(md(t('extraTitle')), [
      {label:lbl[0], fn:showExtra},
      {label:lbl[1], fn:startFlow, cls:'primary'},
      backBtn()
    ]);
  }, 750);
}
function showExtra(){
  addUser(t('svcButtonsLabels')[0]);
  addBotText(t('extraText'), [bookBtn(), backBtn()], 450);
}

/* ============ HORAIRES & ACCÈS ============ */
function showInfo(){
  addUser(t('menu')[2]);
  addBotText(t('hoursText')+"\n\n"+t('accessText'), null, 400);
  setTimeout(function(){
    var f = t('faqButtons');
    addBot(md(t('faqTitle')), [
      {label:f[0], fn:showExtra},
      {label:f[1], fn:showGroups},
      {label:f[2], fn:showAccess},
      bookBtn()
    ]);
  }, 900);
}
function showAccess(){ addUser(t('faqButtons')[2]); addBotText(t('accessText'), [bookBtn(), backBtn()], 400); }
function showGroups(){
  addUser(t('faqButtons')[1]);
  addBotText(t('groupsText'), [
    bookBtn(),
    {label:t('waBtn'), fn:function(){ waOpen(t('waPrefix')); }, cls:'wa'},
    backBtn()
  ], 450);
}

/* ============ HANDOFF ============ */
function humanHandoff(){
  addUser(t('menu')[3]);
  addBotText(t('humanHandoff'), [
    {label:t('waBtn'), fn:function(){ waOpen(t('waPrefix')); }, cls:'wa'},
    backBtn()
  ], 400);
}

/* ============ PARCOURS RDV ============ */
function startFlow(){
  addUser(t('menu')[0]);
  flow = {i:0, answers:[], name:null, phone:null, phase:'steps'};
  addBotText(t('flowStart'), null, 300);
  setTimeout(function(){ askStep(0); }, 700);
}
function askStep(i){
  var st = t('steps')[i];
  var btns = (st.opts||[]).map(function(o){
    return {label:o, fn:function(){ pickStep(i, o); }};
  });
  addBotText(st.q, btns.length?btns:null, 450);
}
function pickStep(i, label){
  addUser(label);
  flow.answers[i] = label;
  nextStep();
}
function nextStep(){
  flow.i++;
  if(flow.i < t('steps').length){ askStep(flow.i); }
  else { flow.phase = 'name'; addBotText(t('askName'), null, 450); }
}
function finishFlow(){
  flow.phase = 'done';
  showTyping(function(){
    var steps = t('steps');
    var lines = '';
    for(var i=0;i<steps.length;i++){
      lines += '<b>'+esc(steps[i].label)+' :</b> '+esc(flow.answers[i]||'—')+'<br>';
    }
    lines += '<b>'+esc(t('summaryName'))+' :</b> '+esc(flow.name)+'<br>';
    lines += '<b>'+esc(t('summaryPhone'))+' :</b> '+esc(flow.phone);
    var row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = '<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">'+
      '<div class="card"><div class="cardhead"><span class="cname">'+esc(t('summaryTitle'))+'</span></div>'+
      '<div class="cardbody">'+lines+
      '<hr style="border:none;border-top:1px solid #e0ecf1;margin:8px 0">'+
      '<span style="font-size:12px;color:var(--muted)">'+esc(t('summaryFooter'))+'</span>'+
      '</div></div></div>';
    chatEl.appendChild(row); scrollBottom();
    var waText = t('waPrefix');
    for(var j=0;j<steps.length;j++){ waText += "\n"+steps[j].label+': '+(flow.answers[j]||'-'); }
    waText += "\n"+t('summaryName')+': '+flow.name+"\n"+t('summaryPhone')+': '+flow.phone;
    addBot('<span style="font-size:12.5px;color:var(--muted)">'+esc(t('demoNote'))+'</span>', [
      {label:t('sendWa'), fn:function(){ waOpen(waText); }, cls:'wa'},
      {label:t('newQuery'), fn:resetChat}
    ]);
  }, 600);
}
function resetChat(){ flow = null; addBotText(t('welcome'), mainMenuButtons(), 300); }

/* ============ LANGUE ============ */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function detectLang(text){
  var n = normalize(text);
  var dic = {
    fr:['bonjour','salut','bonsoir','rendez','reserver','reservation','horaire','merci','oui','je souhaite','pouvez'],
    en:['hello','hi ','hey','appointment','book','booking','hours','thanks','yes','i would','could you'],
    es:['hola','buenas','cita','reservar','reserva','horario','gracias','si','quiero','puede'],
    ca:['hola','bon dia','bona tarda','cita','reservar','horari','gracies','vull','pots','voldria']
  };
  var scores = {fr:0,en:0,es:0,ca:0};
  Object.keys(dic).forEach(function(k){ dic[k].forEach(function(w){ if(n.indexOf(w)>-1) scores[k]++; }); });
  var best = Object.keys(scores).sort(function(a,b){ return scores[b]-scores[a]; })[0];
  return scores[best] > 0 ? best : null;
}
function forceLang(l){
  lang = l;
  var btns = document.querySelectorAll('.langbtn');
  for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('active', btns[i].dataset.lang===l); }
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = ''; flow = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
}
function forceLangSilent(l){
  lang = l;
  var btns = document.querySelectorAll('.langbtn');
  for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('active', btns[i].dataset.lang===l); }
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ============ TEXTE LIBRE ============ */
function anyOf(n, arr){ return arr.some(function(w){ return n.indexOf(w)>-1; }); }
function handleFreeText(raw){
  var text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value = '';

  if(flow && flow.phase==='steps'){
    var st = t('steps')[flow.i];
    if(!st.opts || !st.opts.length){ flow.answers[flow.i] = text; nextStep(); return; }
  }
  if(flow && flow.phase==='name'){ flow.name = text; flow.phase='phone'; addBotText(t('askPhone').replace('{name}', text), null, 400); return; }
  if(flow && flow.phase==='phone'){ flow.phone = text; finishFlow(); return; }

  var n = normalize(text);
  if(anyOf(n, KW.flow)){ startFlow(); return; }
  if(anyOf(n, KW.svc)){ showSvc(); return; }
  if(anyOf(n, KW.info)){ showInfo(); return; }
  if(anyOf(n, ['whatsapp','humain','human','humano','huma','equipe','equipo','equip','appeler','llamar','call','telephone','telefon'])){ humanHandoff(); return; }
  if(anyOf(n, ['bonjour','salut','bonsoir','hola','buenas','hello','hi','hey','bon dia'])){ addBotText(t('welcome'), mainMenuButtons(), 400); return; }
  addBotText(t('fallback'), mainMenuButtons(), 450);
}
function handleSend(){
  var val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){ forceLangSilent(detectLang(val) || 'fr'); }
  handleFreeText(val);
}
inputEl.addEventListener('keydown', function(e){ if(e.key==='Enter') handleSend(); });

try{

    var device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';

})();
