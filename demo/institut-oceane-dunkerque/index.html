<style>
:root{--a:#4a2c46;--b:#331e30;--c:#8e4a72;--d:#d98aa6;--e:#b9647f;--bg:#faf1f4;--paper:#fffcfd;--ink:#332830;--muted:#8f7d87;--line:#f0dde4;--line2:#f3e4ea;--line3:#eddbe2;--line4:#f1e2e8;--wa:#25d366;--wa-dark:#1ebe5b;--radius:18px;}

var lang = 'fr';
var flow = null;
var chatEl = document.getElementById('chat');
var inputEl = document.getElementById('msgInput');

function t(k){ return (CFG.S[lang] || CFG.S.fr)[k]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
function scrollBottom(){ requestAnimationFrame(function(){ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  var row = document.createElement('div');
  row.className = 'row user';
  var b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = md(text);
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
}

function makeButtons(buttons){
  var wrap = document.createElement('div');
  wrap.className = 'quick';
  buttons.forEach(function(b){
    var el = document.createElement('button');
    el.className = 'qbtn' + (b.cls ? ' ' + b.cls : '');
    el.textContent = b.label;
    el.addEventListener('click', b.fn);
    wrap.appendChild(el);
  });
  return wrap;
}

function addBot(html, buttons, isNode){
  var row = document.createElement('div');
  row.className = 'row bot';
  var stack = document.createElement('div');
  stack.className = 'stack';
  if (html !== null){
    var b = document.createElement('div');
    b.className = 'bubble';
    if (isNode){ b.style.padding='0'; b.style.background='transparent'; b.style.boxShadow='none'; b.style.maxWidth='94%'; b.appendChild(html); }
    else { b.innerHTML = html; }
    stack.appendChild(b);
  }
  if (buttons && buttons.length){
    var holder = document.createElement('div');
    holder.style.marginTop = '6px';
    holder.appendChild(makeButtons(buttons));
    stack.appendChild(holder);
  }
  row.appendChild(stack);
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  var row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(function(){ row.remove(); cb(); }, delay || 550);
}
function say(text, buttons, delay){ showTyping(function(){ addBot(md(text), buttons); }, delay); }

/* ---------- MENU ---------- */
function mainMenuButtons(){
  var m = t('menu');
  return [
    {label:m[0], fn:startFlow, cls:'primary'},
    {label:m[1], fn:showCard},
    {label:m[2], fn:showHours},
    {label:m[3], fn:humanHandoff, cls:'wa'}
  ];
}
function backBtn(){ return {label: t('back') + t('menuLabel'), fn: showMenu}; }
function showMenu(){ say(t('welcome'), mainMenuButtons(), 300); }

/* ---------- CARTE / PRESTATIONS ---------- */
function cardNode(){
  var wrap = document.createElement('div');
  wrap.className = 'card';
  var head = document.createElement('div');
  head.className = 'cardhead';
  head.innerHTML = '<span class="cname">' + esc(t('cardTitle')) + '</span><span class="cprice">' + esc(t('cardBadge')) + '</span>';
  var body = document.createElement('div');
  body.className = 'cardbody';
  t('sections').forEach(function(sec){
    var sr = document.createElement('div');
    sr.className = 'spec-row';
    sr.innerHTML = '<span class="spec">' + esc(sec.label) + '</span>';
    body.appendChild(sr);
    sec.items.forEach(function(it){
      var d = document.createElement('div');
      d.className = 'dish';
      d.innerHTML = '<div class="dname">' + esc(it.n) + '</div><div class="ddesc">' + esc(it.d) + '</div>';
      body.appendChild(d);
    });
  });
  var note = document.createElement('div');
  note.className = 'demo-note';
  note.textContent = 'ℹ️ ' + t('demoNote');
  body.appendChild(note);
  wrap.appendChild(head); wrap.appendChild(body);
  return wrap;
}

function showCard(){
  addUser(t('menu')[1]);
  say(t('cardIntro'), null, 400);
  setTimeout(function(){
    addBot(cardNode(), null, true);
    var cb = t('cardButtons');
    addBot(md(t('extraLine')), [
      {label:cb[0], fn:showExtra},
      {label:cb[1], fn:startFlow, cls:'primary'},
      {label:cb[2], fn:showMenu}
    ]);
  }, 700);
}

function showExtra(){
  addUser(t('cardButtons')[0]);
  say(t('extraLine'), [{label:t('menu')[0], fn:startFlow, cls:'primary'}, backBtn()], 450);
}

/* ---------- HORAIRES / INFOS ---------- */
function showHours(){
  addUser(t('menu')[2]);
  var fb = t('faqButtons');
  say(t('faqTitle'), [
    {label:fb[0], fn:showExtra},
    {label:fb[1], fn:showGroups},
    {label:fb[2], fn:showAccess},
    {label:fb[3], fn:showMenu}
  ], 350);
  setTimeout(function(){
    addBot(md(t('hoursText') + '\n\n' + t('accessText')), [
      {label:t('menu')[0], fn:startFlow, cls:'primary'}, backBtn()
    ]);
  }, 950);
}
function showAccess(){
  addUser(t('faqButtons')[2]);
  say(t('accessText'), [{label:t('menu')[0], fn:startFlow, cls:'primary'}, backBtn()], 400);
}
function showGroups(){
  addUser(t('faqButtons')[1]);
  say(t('groupsText'), [
    {label:t('menu')[0], fn:startFlow, cls:'primary'},
    {label:'💬 WhatsApp', fn:openWa, cls:'wa'}
  ], 450);
}

/* ---------- HANDOFF ---------- */
function waLink(text){ return 'https://wa.me/' + CFG.wa + '?text=' + encodeURIComponent(text); }
function openWa(){ window.open(waLink(t('waPrefix')), '_blank'); }
function humanHandoff(){
  addUser(t('menu')[3]);
  say(t('humanHandoff'), [{label:'💬 WhatsApp', fn:openWa, cls:'wa'}, backBtn()], 400);
}

/* ---------- FLUX SCRIPTE ---------- */
function startFlow(){
  addUser(t('menu')[0]);
  flow = {i:0, answers:[], stage:'steps', name:null, phone:null};
  say(t('flowStart'), null, 300);
  setTimeout(askStep, 700);
}
function askStep(){
  var steps = t('steps');
  if (flow.i >= steps.length){ flow.stage = 'name'; say(t('askName'), null, 450); return; }
  var st = steps[flow.i];
  say(st.ask, st.opts.map(function(o){ return {label:o, fn:function(){ pick(o); }}; }), 450);
}
function pick(label){
  if (!flow || flow.stage !== 'steps') return;
  addUser(label);
  flow.answers.push(label);
  flow.i++;
  askStep();
}
function finish(){
  flow.stage = 'done';
  showTyping(function(){
    var steps = t('steps');
    var card = document.createElement('div');
    card.className = 'card';
    var head = document.createElement('div');
    head.className = 'cardhead';
    head.innerHTML = '<span class="cname">' + esc(t('summaryTitle')) + '</span>';
    var body = document.createElement('div');
    body.className = 'cardbody';
    var lines = '';
    steps.forEach(function(st, i){ lines += '<b>' + esc(st.label) + ' :</b> ' + esc(flow.answers[i] || '—') + '<br>'; });
    lines += '<b>' + esc(t('lName')) + ' :</b> ' + esc(flow.name) + '<br>';
    lines += '<b>' + esc(t('lPhone')) + ' :</b> ' + esc(flow.phone);
    body.innerHTML = lines + '<hr style="border:none;border-top:1px solid var(--line2);margin:8px 0"><span style="font-size:12px;color:var(--muted)">' + esc(t('summaryFooter')) + '</span>';
    card.appendChild(head); card.appendChild(body);
    addBot(card, null, true);
    var waText = t('waPrefix');
    steps.forEach(function(st, i){ waText += '\n' + st.label + ': ' + (flow.answers[i] || '-'); });
    waText += '\n' + t('lName') + ': ' + flow.name + '\n' + t('lPhone') + ': ' + flow.phone;
    addBot(null, [
      {label:t('sendWa'), fn:function(){ window.open(waLink(waText), '_blank'); }, cls:'wa'},
      {label:t('newQuery'), fn:resetChat}
    ]);
  }, 600);
}
function resetChat(){ flow = null; say(t('welcome'), mainMenuButtons(), 300); }

/* ---------- LANGUE ---------- */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
var LANGHINT = {
  fr:['bonjour','salut','bonsoir','rendez','reserv','horaire','merci','oui','tarif','disponible','souhaite'],
  es:['hola','buenas','cita','reservar','horario','gracias','quiero','disponible','tarde'],
  en:['hello','hi ','hey','appointment','book','hours','thanks','please','available','would like'],
  ca:['bon dia','bona tarda','cita','reservar','horari','gracies','vull','disponible','vespre']
};
function detectLang(text){
  var n = normalize(text), best = null, bs = 0;
  Object.keys(LANGHINT).forEach(function(l){
    var s = 0;
    LANGHINT[l].forEach(function(w){ if (n.indexOf(w) >= 0) s++; });
    if (s > bs){ bs = s; best = l; }
  });
  return bs > 0 ? best : null;
}
function applyLang(l, reset){
  lang = l;
  var btns = document.querySelectorAll('.langbtn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-lang') === l);
  document.getElementById('statusTxt').textContent = t('status');
  document.getElementById('footerBadge').textContent = t('footer');
  inputEl.placeholder = t('placeholder');
  if (reset){ chatEl.innerHTML = ''; flow = null; say(t('welcome'), mainMenuButtons(), 250); }
}

/* ---------- TEXTE LIBRE ---------- */
var KW = {
  flow:['reserv','rendez','rdv','cita','appointment','book','taula','mesa','table','visite','viewing','estimation','valoracion','valoració','urgence','urgencia','emergency','douleur','dolor','pain'],
  card:['carte','menu','carta','soin','tratamiento','treatment','prestation','motif','bien','propiedad','property','dish','plat'],
  hours:['horaire','horari','horario','hour','ouvert','abierto','open','ferme','tancat','quand'],
  access:['acces','acceso','direction','parking','adresse','address','venir','llegar','arribar','ou etes','where'],
  extra:['allerg','gluten','lactose','sensible','urgence','urgencia','emergency','contre-indication','estimation','valoracion','prix','precio','price'],
  human:['whatsapp','humain','human','humano','equipe','equipo','equip','appeler','llamar','call','telephone','parler','hablar'],
  hello:['bonjour','salut','bonsoir','hola','buenas','hello','hi','hey','bon dia']
};
function anyOf(n, arr){ for (var i = 0; i < arr.length; i++) if (n.indexOf(arr[i]) >= 0) return true; return false; }

function handleFreeText(raw){
  var text = raw.trim();
  if (!text) return;
  addUser(text);
  inputEl.value = '';
  if (flow && flow.stage === 'name'){ flow.name = text; flow.stage = 'phone'; say(t('askPhone').replace('{name}', text), null, 400); return; }
  if (flow && flow.stage === 'phone'){ flow.phone = text; finish(); return; }
  var n = normalize(text);
  if (anyOf(n, KW.human)) { humanHandoff(); return; }
  if (anyOf(n, KW.extra) && !anyOf(n, KW.flow)) { showExtra(); return; }
  if (anyOf(n, KW.flow))  { startFlow(); return; }
  if (anyOf(n, KW.card))  { showCard(); return; }
  if (anyOf(n, KW.hours)) { showHours(); return; }
  if (anyOf(n, KW.access)){ showAccess(); return; }
  if (anyOf(n, KW.hello)) { say(t('welcome'), mainMenuButtons(), 400); return; }
  say(t('fallback'), mainMenuButtons(), 450);
}
function handleSend(){
  var val = inputEl.value;
  if (!val.trim()) return;
  if (!flow){ var d = detectLang(val); if (d && d !== lang) applyLang(d, false); }
  handleFreeText(val);
}
document.getElementById('sendBtn').addEventListener('click', handleSend);
inputEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') handleSend(); });
(function(){
  var btns = document.querySelectorAll('.langbtn');
  for (var i = 0; i < btns.length; i++){
    btns[i].addEventListener('click', function(){ applyLang(this.getAttribute('data-lang'), true); });
  }
})();

/* ---------- PING DE VISITE ---------- */
try{
  if (location.hash !== '#test'){
    var device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    fetch('https://ntfy.sh/' + CFG.topic, {method:'POST', body:'Visite demo ' + CFG.name + ' · ' + device + ' · ' + (navigator.language || '?')});
  }
}catch(e){}

/* ---------- INIT ---------- */
document.getElementById('hName').textContent = 'Alex · ' + CFG.name;
applyLang('fr', false);
say(t('welcome'), mainMenuButtons(), 200);
</script>
