<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Alex · Marceau Realty International</title>
<meta name="description" content="Alex, l'assistant virtuel de Marceau Realty International — achat, vente, estimation et prise de rendez-vous à Paris 16e en une minute.">
<style>
:root{
  --navy:#101d33;
  --navy-dark:#0a1424;
  --slate:#1d3155;
  --gold:#c2a878;
  --gold-dark:#a2854f;
  --bg:#f3f0e9;
  --paper:#fffdf9;
  --ink:#20242c;
  --muted:#8a8578;
  --wa:#25d366;
  --wa-dark:#1ebe5b;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1c3053 0%, var(--navy) 55%, var(--navy-dark) 100%);
  min-height:100%;
  display:flex;
  justify-content:center;
  color:var(--ink);
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.4);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 100%);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15.5px;line-height:1.2;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.langbar{display:flex;gap:4px;}
.langbtn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:.3px;
}
.langbtn.active{background:#fff;color:var(--slate);}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(var(--bg),var(--bg));
}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{
  max-width:84%;
  padding:10px 13px;
  border-radius:var(--radius);
  font-size:14.5px;
  line-height:1.45;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.row.bot .bubble{
  background:var(--paper);
  border-bottom-left-radius:4px;
  color:var(--ink);
}
.row.user .bubble{
  background:linear-gradient(135deg,var(--slate),var(--gold-dark));
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble b{color:var(--slate);}
.row.user .bubble b{color:#fff;}

.card{
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  border:1px solid #e6ded0;
}
.card .cardhead{
  background:linear-gradient(135deg,var(--navy),var(--slate));
  color:#fff;padding:9px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card .cardhead .cname{font-weight:700;font-size:14.5px;}
.card .cardhead .cprice{font-size:12.5px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.card .cardbody{padding:10px 12px;font-size:13.5px;color:var(--ink);}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{
  background:#fff;
  border:1.5px solid var(--gold);
  color:var(--gold-dark);
  font-size:13px;
  font-weight:600;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:.15s;
}
.qbtn:hover{background:var(--gold);color:#fff;}
.qbtn.primary{background:var(--gold);border-color:var(--gold-dark);color:#fff;}
.qbtn.primary:hover{background:var(--gold-dark);}
.qbtn.wa{background:var(--wa);border-color:var(--wa-dark);color:#fff;}
.qbtn.wa:hover{background:var(--wa-dark);}

.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

/* input bar */
#inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid #ece5d6;
  position:sticky;
  bottom:0;
}
#msgInput{
  flex:1;
  border:1.5px solid #e0d7c7;
  background:var(--bg);
  border-radius:22px;
  padding:11px 16px;
  font-size:14.5px;
  outline:none;
  color:var(--ink);
}
#msgInput:focus{border-color:var(--gold);}
#sendBtn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(162,133,79,.4);
}
#sendBtn:active{transform:scale(.93);}

.footerbadge{
  text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 2px;
  background:var(--paper);
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#d8cbb4;border-radius:3px;}
</style>
</head>

/* ================= STATE ================= */
let lang = null;
let booking = null; // {intent, step, type, area, value, valueType, slot, name, phone}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function t(key){ return (S[lang]||S.fr)[key]; }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(str){
  return esc(str)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  const row = document.createElement('div');
  row.className='row user';
  row.innerHTML = `<div class="bubble">${md(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  const row = document.createElement('div');
  row.className='row bot';
  row.id='typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(()=>{
    row.remove();
    cb();
  }, delay || 550);
}

function addBot(html, buttons){
  const row = document.createElement('div');
  row.className='row bot';
  let btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = `<div class="quick">${buttons.map(b=>`<button class="qbtn ${b.cls||''}" onclick="${b.onclick}">${esc(b.label)}</button>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="stack"><div class="bubble">${html}</div>${btnHtml ? `<div style="margin-top:6px">${btnHtml}</div>` : ''}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addBotText(text, buttons, delay){
  showTyping(()=>addBot(md(text), buttons), delay);
}

/* ================= MENU (navigation) ================= */
function mainMenuButtons(){
  const m = t('menu');
  return [
    {label:m[0], onclick:"startProject('buy')", cls:"primary"},
    {label:m[1], onclick:"startProject('sell')"},
    {label:m[2], onclick:"startProject('estimate')"},
    {label:m[3], onclick:"humanHandoff()", cls:"wa"}
  ];
}

function backLabel(){ return "⬅️ "+t('menuLabel'); }

function showMenu(){
  addBotText(t('welcome').split('\n').slice(1).join('\n') || t('welcome'), mainMenuButtons(), 300);
}

/* ================= HANDOFF HUMAIN ================= */
function humanHandoff(){
  addUser(t('menu')[3]);
  addBotText(t('humanHandoff'), [
    {label:"💬 WhatsApp", onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t('waPrefix'))}','_blank')`, cls:'wa'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

/* ================= PARCOURS PROJET ================= */
function intentLabel(intent){
  return intent==='buy' ? t('labelBuy') : intent==='sell' ? t('labelSell') : t('labelEstimate');
}
function menuIndexForIntent(intent){
  return intent==='buy' ? 0 : intent==='sell' ? 1 : 2;
}

function startProject(intent){
  addUser(t('menu')[menuIndexForIntent(intent)]);
  booking = {intent, step:'type', type:null, area:null, value:null, valueType:(intent==='buy'?'budget':'surface'), slot:null, name:null, phone:null};
  const startKey = intent==='buy' ? 'buyStart' : intent==='sell' ? 'sellStart' : 'estimateStart';
  addBotText(t(startKey), null, 300);
  setTimeout(()=>{
    addBotText(t('askType'), t('typeOpts').map(l=>({label:l, onclick:`bookingType('${l.replace(/'/g,"\\'")}')`})));
  }, 750);
}

function bookingType(label){
  addUser(label);
  booking.type = label;
  booking.step='area';
  addBotText(t('askArea'), t('areaOpts').map(l=>({label:l, onclick:`bookingArea('${l.replace(/'/g,"\\'")}')`})), 450);
}

function bookingArea(label){
  addUser(label);
  booking.area = label;
  booking.step='value';
  if(booking.valueType==='budget'){
    addBotText(t('askBudget'), t('budgetOpts').map(l=>({label:l, onclick:`bookingValue('${l.replace(/'/g,"\\'")}')`})), 450);
  }else{
    addBotText(t('askSurface'), t('surfaceOpts').map(l=>({label:l, onclick:`bookingValue('${l.replace(/'/g,"\\'")}')`})), 450);
  }
}

function bookingValue(label){
  addUser(label);
  booking.value = label;
  booking.step='slot';
  addBotText(t('askSlot'), t('slotOpts').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
}

function bookingSlot(label){
  addUser(label);
  booking.slot = label;
  booking.step='name';
  addBotText(t('askName'), null, 450);
}

function bookingHandleText(text){
  if(!booking) return false;
  if(booking.step==='name'){
    booking.name = text;
    booking.step='phone';
    addBotText(t('askPhone').replace('{name}', text), null, 400);
    return true;
  }
  if(booking.step==='phone'){
    booking.phone = text;
    finishBooking();
    return true;
  }
  return false;
}

function finishBooking(){
  booking.step='done';
  showTyping(()=>{
    const valLabel = booking.valueType==='budget' ? t('summaryBudget') : t('summarySurface');
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">
      <div class="card">
        <div class="cardhead"><span class="cname">${t('summaryTitle')}</span></div>
        <div class="cardbody">
          <b>${t('summaryProject')} :</b> ${esc(intentLabel(booking.intent))}<br>
          <b>${t('summaryType')} :</b> ${esc(booking.type)}<br>
          <b>${t('summaryArea')} :</b> ${esc(booking.area)}<br>
          <b>${esc(valLabel)} :</b> ${esc(booking.value)}<br>
          <b>${t('summarySlot')} :</b> ${esc(booking.slot)}<br>
          <b>${t('summaryName')} :</b> ${esc(booking.name)}<br>
          <b>${t('summaryPhone')} :</b> ${esc(booking.phone)}
          <hr style="border:none;border-top:1px solid #ece2d4;margin:8px 0">
          <span style="font-size:12px;color:var(--muted)">${md(t('summaryFooter'))}</span>
        </div>
      </div></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    const valLine = `${valLabel}: ${booking.value}`;
    const waText = `${t('waPrefix')}\n${t('summaryProject')}: ${intentLabel(booking.intent)}\n${t('summaryType')}: ${booking.type}\n${t('summaryArea')}: ${booking.area}\n${valLine}\n${t('summarySlot')}: ${booking.slot}\n${t('summaryName')}: ${booking.name}\n${t('summaryPhone')}: ${booking.phone}`;
    addBot('', [
      {label:t('sendWa'), onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}','_blank')`, cls:'wa'},
      {label:t('newQuery'), onclick:"resetChat()"}
    ]);
    chatEl.lastChild.querySelector('.bubble').style.display='none';
  }, 600);
}

function resetChat(){
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 300);
}

/* ================= LANGUE ================= */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function detectLang(text){
  const n = normalize(text);
  const fr = ['bonjour','salut','bonsoir','acheter','achat','vendre','vente','estim','appartement','maison','budget','conseiller','rendez','visite','merci','oui','non'];
  const en = ['hello','hi ','hey','buy','sell','sale','valu','apartment','house','budget','advisor','appointment','viewing','thanks','yes','no '];
  const es = ['hola','buenas','comprar','vender','venta','estim','piso','casa','presupuesto','asesor','cita','visita','gracias','si','no '];
  const ca = ['hola','bon dia','comprar','vendre','venda','estim','pis','casa','pressupost','assessor','cita','visita','gracies','voldria'];
  let scores = {fr:0,en:0,es:0,ca:0};
  fr.forEach(w=>{ if(n.includes(w)) scores.fr++; });
  en.forEach(w=>{ if(n.includes(w)) scores.en++; });
  es.forEach(w=>{ if(n.includes(w)) scores.es++; });
  ca.forEach(w=>{ if(n.includes(w)) scores.ca++; });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0 ? best[0] : null;
}

function forceLang(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = '';
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
}

function forceLangSilent(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ================= TEXTE LIBRE ================= */
function normalizedIncludesAny(n, arr){ return arr.some(w=>n.includes(w)); }

function handleFreeText(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value='';

  if(booking && (booking.step==='name'||booking.step==='phone')){
    bookingHandleText(text);
    return;
  }

  const n = normalize(text);

  if(normalizedIncludesAny(n,['estim','evalu','valu','valor','taxa','tasac','prix de mon','worth'])){ startProject('estimate'); return; }
  if(normalizedIncludesAny(n,['vendre','vente','sell','vender','venda','mettre en vente','ceder'])){ startProject('sell'); return; }
  if(normalizedIncludesAny(n,['achet','achat','acquer','buy','comprar','compra','investir','recherche un','cherche un appart','cherche une maison'])){ startProject('buy'); return; }
  if(normalizedIncludesAny(n,['humain','human','humano','conseiller','asesor','assessor','agent','appeler','llamar','call','telephone','contacter','whatsapp'])){ humanHandoff(); return; }
  if(normalizedIncludesAny(n,['bonjour','salut','bonsoir','hola','buenas','hello','hi','hey','bon dia'])){
    addBotText(t('welcome'), mainMenuButtons(), 400); return;
  }

  addBotText(t('fallback'), mainMenuButtons(), 450);
}

function handleSend(){
  const val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){
    const d = detectLang(val) || 'fr';
    forceLangSilent(d);
  }
  handleFreeText(val);
}

inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

/* ================= VISIT PING ================= */
try{
  if(location.hash !== '#test'){
    const device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    fetch('https://ntfy.sh/agentia-demo-marceaurealty-p3k8', {method:'POST', body:'Visite demo Marceau Realty · '+device+' · '+(navigator.language||'?')});
  }
}catch(e){}

/* ================= INIT ================= */
function init(){
  lang = 'fr';
  document.querySelector('.langbtn[data-lang="fr"]').classList.add('active');
  addBotText(t('welcome'), mainMenuButtons(), 200);
}
init();
</script>
