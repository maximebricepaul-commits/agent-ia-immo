<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Centre Veterinari Gomis-Vergès · Démo ALEX</title>
<meta name="description" content="Alex, l'assistant virtuel du Centre Veterinari Gomis-Vergès (L'Escala) — prise de rendez-vous pour votre animal, urgences, horaires et adresse en moins d'une minute.">
<style>
:root{
  --teal:#0f4c5c;
  --teal-dark:#0a3641;
  --aqua:#2a9d8f;
  --mint:#57c4b0;
  --mint-dark:#3ba694;
  --sky:#e0f2f1;
  --bg:#f2f8f8;
  --paper:#ffffff;
  --ink:#213436;
  --muted:#7c9295;
  --alert:#e07a5f;
  --alert-dark:#c85f45;
  --wa:#25d366;
  --wa-dark:#1ebe5b;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #15697d 0%, var(--teal) 55%, var(--teal-dark) 100%);
  min-height:100%;
  display:flex;
  justify-content:center;
  color:var(--ink);
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.35);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--teal) 0%,var(--aqua) 100%);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--mint),var(--mint-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15.5px;line-height:1.2;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.langbar{display:flex;gap:4px;}
.langbtn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:.3px;
}
.langbtn.active{background:#fff;color:var(--teal);}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(var(--bg),var(--bg));
}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{
  max-width:84%;
  padding:10px 13px;
  border-radius:var(--radius);
  font-size:14.5px;
  line-height:1.45;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.row.bot .bubble{
  background:var(--paper);
  border-bottom-left-radius:4px;
  color:var(--ink);
}
.row.user .bubble{
  background:linear-gradient(135deg,var(--teal),var(--aqua));
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble b{color:var(--teal);}
.row.user .bubble b{color:#fff;}

.card{
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  border:1px solid #d9eae8;
}
.card .cardhead{
  background:linear-gradient(135deg,var(--teal),var(--aqua));
  color:#fff;padding:9px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card .cardhead .cname{font-weight:700;font-size:14.5px;}
.card .cardhead .cprice{font-size:12.5px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.card .cardbody{padding:10px 12px;font-size:13.5px;color:var(--ink);}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}

/* alert box for urgencia / no medical advice */
.alertbox{
  background:#fdeee9;border:1px solid #f3c9bd;border-radius:12px;
  padding:9px 12px;font-size:12.8px;color:var(--alert-dark);margin-top:8px;line-height:1.4;
}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{
  background:#fff;
  border:1.5px solid var(--aqua);
  color:var(--teal);
  font-size:13px;
  font-weight:600;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:.15s;
}
.qbtn:hover{background:var(--aqua);color:#fff;}
.qbtn.primary{background:var(--aqua);border-color:var(--mint-dark);color:#fff;}
.qbtn.primary:hover{background:var(--mint-dark);}
.qbtn.alert{background:var(--alert);border-color:var(--alert-dark);color:#fff;}
.qbtn.alert:hover{background:var(--alert-dark);}
.qbtn.wa{background:var(--wa);border-color:var(--wa-dark);color:#fff;}
.qbtn.wa:hover{background:var(--wa-dark);}

.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

/* input bar */
#inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid #dceae8;
  position:sticky;
  bottom:0;
}
#msgInput{
  flex:1;
  border:1.5px solid #d3e4e2;
  background:var(--bg);
  border-radius:22px;
  padding:11px 16px;
  font-size:14.5px;
  outline:none;
  color:var(--ink);
}
#msgInput:focus{border-color:var(--aqua);}
#sendBtn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--aqua),var(--mint-dark));
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(42,157,143,.4);
}
#sendBtn:active{transform:scale(.93);}

.footerbadge{
  text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 2px;
  background:var(--paper);
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#c3ddd9;border-radius:3px;}
</style>
</head>

/* ================= STATE ================= */
let lang = null;
let booking = null; // {step, reason, animal, urgent, slot, name, phone}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function t(key){ return (S[lang]||S.ca)[key]; }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(str){
  return esc(str)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  const row = document.createElement('div');
  row.className='row user';
  row.innerHTML = `<div class="bubble">${md(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  const row = document.createElement('div');
  row.className='row bot';
  row.id='typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(()=>{
    row.remove();
    cb();
  }, delay || 550);
}

function addBot(html, buttons){
  const row = document.createElement('div');
  row.className='row bot';
  let btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = `<div class="quick">${buttons.map(b=>`<button class="qbtn ${b.cls||''}" onclick="${b.onclick}">${esc(b.label)}</button>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="stack"><div class="bubble">${html}</div>${btnHtml ? `<div style="margin-top:6px">${btnHtml}</div>` : ''}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addBotText(text, buttons, delay){
  showTyping(()=>addBot(md(text), buttons), delay);
}

/* ================= MENU (navigation) ================= */
function mainMenuButtons(){
  const m = t('menu');
  return [
    {label:m[0], onclick:"startBooking()", cls:"primary"},
    {label:m[1], onclick:"showUrgency()", cls:"alert"},
    {label:m[2], onclick:"showHours()"},
    {label:m[3], onclick:"humanHandoff()", cls:"wa"}
  ];
}

function backLabel(){ return "⬅️ "+t('menuLabel'); }

function showMenu(){
  addBotText(t('welcome').split('\n').slice(1).join('\n') || t('welcome'), mainMenuButtons(), 300);
}

/* ================= HORARIO & DIRECCIÓN ================= */
function showHours(){
  addUser(t('menu')[2]);
  addBotText(t('faqTitle'), t('faqButtons').map((label,i)=>{
    const keys=['hours','access','first','menu'];
    const map={hours:"showHoursText()",access:"showAccess()",first:"showFirstVisit()",menu:"showMenu()"};
    return {label, onclick: map[keys[i]]};
  }), 350);
  setTimeout(()=>{
    addBot(md(t('hoursText')+"\n\n"+t('accessText')), [
      {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
      {label:backLabel(), onclick:"showMenu()"}
    ]);
  }, 900);
}

function showHoursText(){
  addUser(t('faqButtons')[0]);
  addBotText(t('hoursText'), [
    {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

function showAccess(){
  addUser(t('faqButtons')[1]);
  addBotText(t('accessText'), [
    {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

function showFirstVisit(){
  addUser(t('faqButtons')[2]);
  addBotText(t('firstVisitText'), [
    {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 450);
}

/* ================= URGENCIA (menú directo) ================= */
function showUrgency(){
  addUser(t('menu')[1]);
  addBotText(t('urgencyTitle'), null, 300);
  setTimeout(()=>{
    addBot(md(t('urgencyIntro')), [
      {label:t('urgencyStartBtn'), onclick:"startBookingUrgent()", cls:'alert'},
      {label:t('menu')[3], onclick:"humanHandoff()", cls:'wa'},
      {label:backLabel(), onclick:"showMenu()"}
    ]);
  }, 750);
}

/* ================= HANDOFF HUMANO ================= */
function humanHandoff(){
  addUser(t('menu')[3]);
  addBotText(t('humanHandoff'), [
    {label:"💬 WhatsApp", onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t('waPrefix'))}','_blank')`, cls:'wa'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

/* ================= CITA ================= */
function startBooking(){
  addUser(t('menu')[0]);
  booking = {step:'reason', reason:null, animal:null, urgent:null, slot:null, name:null, phone:null};
  addBotText(t('bookStart'), null, 300);
  setTimeout(()=>{
    addBotText(t('askReason'), t('reasonOpts').map(l=>({label:l, onclick:`bookingReason('${l.replace(/'/g,"\\'")}')`})));
  }, 700);
}

/* démarrage direct depuis l'urgence : motif = malaise/urgence, urgence présumée */
function startBookingUrgent(){
  addUser(t('urgencyStartBtn'));
  booking = {step:'animal', reason:t('reasonOpts')[2], animal:null, urgent:true, slot:null, name:null, phone:null};
  addBotText(t('askAnimal'), t('animalOpts').map(l=>({label:l, onclick:`bookingAnimal('${l.replace(/'/g,"\\'")}')`})), 400);
}

function bookingReason(label){
  addUser(label);
  booking.reason = label;
  booking.step='animal';
  addBotText(t('askAnimal'), t('animalOpts').map(l=>({label:l, onclick:`bookingAnimal('${l.replace(/'/g,"\\'")}')`})), 450);
}

function bookingAnimal(label){
  addUser(label);
  booking.animal = label;
  if(booking.urgent===true){
    /* entrée directe par l'urgence */
    booking.step='slot';
    addBotText(t('urgentNote'), null, 350);
    setTimeout(()=>{
      addBotText(t('askSlot'), t('slotOptsUrgent').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
    }, 900);
    return;
  }
  const isPain = /😿/.test(booking.reason);
  if(isPain){
    booking.step='urgent';
    addBotText(t('askUrgent'), t('urgentOpts').map((l,i)=>({label:l, onclick:`bookingUrgent(${i===0?'true':'false'},'${l.replace(/'/g,"\\'")}')`, cls:i===0?'alert':''})), 450);
  }else{
    booking.urgent=false;
    booking.step='slot';
    addBotText(t('askSlot'), t('slotOptsNormal').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
  }
}

function bookingUrgent(isUrgent, label){
  addUser(label);
  booking.urgent = isUrgent;
  booking.step='slot';
  if(isUrgent){
    addBotText(t('urgentNote'), null, 350);
    setTimeout(()=>{
      addBotText(t('askSlot'), t('slotOptsUrgent').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
    }, 900);
  }else{
    addBotText(t('askSlot'), t('slotOptsNormal').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
  }
}

function bookingSlot(label){
  addUser(label);
  booking.slot = label;
  booking.step='name';
  addBotText(t('askName'), null, 450);
}

function bookingHandleText(text){
  if(!booking) return false;
  if(booking.step==='name'){
    booking.name = text;
    booking.step='phone';
    addBotText(t('askPhone').replace('{name}', text), null, 400);
    return true;
  }
  if(booking.step==='phone'){
    booking.phone = text;
    finishBooking();
    return true;
  }
  return false;
}

function finishBooking(){
  booking.step='done';
  const urgentLabel = booking.urgent ? t('urgentYes') : t('urgentNo');
  const footer = booking.urgent ? t('summaryFooterUrgent') : t('summaryFooter');
  showTyping(()=>{
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">
      <div class="card">
        <div class="cardhead"><span class="cname">${t('summaryTitle')}</span>${booking.urgent?'<span class="cprice">🚨 '+esc(t('urgentYes'))+'</span>':''}</div>
        <div class="cardbody">
          <b>${t('summaryReason')} :</b> ${esc(booking.reason)}<br>
          <b>${t('summaryAnimal')} :</b> ${esc(booking.animal)}<br>
          <b>${t('summaryUrgent')} :</b> ${esc(urgentLabel)}<br>
          <b>${t('summarySlot')} :</b> ${esc(booking.slot)}<br>
          <b>${t('summaryName')} :</b> ${esc(booking.name)}<br>
          <b>${t('summaryPhone')} :</b> ${esc(booking.phone)}
          <hr style="border:none;border-top:1px solid #dceae8;margin:8px 0">
          <span style="font-size:12px;color:var(--muted)">${md(footer)}</span>
        </div>
      </div></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    const waText = `${t('waPrefix')}\n${t('summaryReason')}: ${booking.reason}\n${t('summaryAnimal')}: ${booking.animal}\n${t('summaryUrgent')}: ${urgentLabel}\n${t('summarySlot')}: ${booking.slot}\n${t('summaryName')}: ${booking.name}\n${t('summaryPhone')}: ${booking.phone}`;
    addBot('', [
      {label:t('sendWa'), onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}','_blank')`, cls:'wa'},
      {label:t('newQuery'), onclick:"resetChat()"}
    ]);
    chatEl.lastChild.querySelector('.bubble').style.display='none';
  }, 600);
}

function resetChat(){
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 300);
}

/* ================= NO MEDICAL ADVICE ================= */
function showNoMedical(){
  addBotText(t('noMedical'), t('noMedicalBtns').map((label,i)=>{
    const acts=["startBookingUrgent()","humanHandoff()","showMenu()"];
    return {label, onclick:acts[i], cls: i===0?'alert':(i===1?'wa':'')};
  }), 450);
}

/* ================= LANGUE ================= */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function detectLang(text){
  const n = normalize(text);
  const ca = ['hola','bon dia','bona tarda','hora','demanar','gos','gat','animal','mascota','vacuna','revisio','urgencia','horari','gracies','vull'];
  const es = ['hola','buenas','cita','pedir','perro','gato','animal','mascota','vacuna','revision','urgencia','horario','gracias','duele'];
  const fr = ['bonjour','salut','bonsoir','rendez','rdv','chien','chat','animal','vaccin','controle','urgence','horaire','merci','prendre'];
  const en = ['hello','hi ','hey','appointment','book','dog','cat','animal','pet','vaccin','check','emergency','hours','thanks'];
  let scores = {ca:0,es:0,fr:0,en:0};
  ca.forEach(w=>{ if(n.includes(w)) scores.ca++; });
  es.forEach(w=>{ if(n.includes(w)) scores.es++; });
  fr.forEach(w=>{ if(n.includes(w)) scores.fr++; });
  en.forEach(w=>{ if(n.includes(w)) scores.en++; });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0 ? best[0] : null;
}

function forceLang(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = '';
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
}

function forceLangSilent(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ================= TEXTE LIBRE ================= */
function normalizedIncludesAny(n, arr){ return arr.some(w=>n.includes(w)); }

function handleFreeText(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value='';

  if(booking && (booking.step==='name'||booking.step==='phone')){
    bookingHandleText(text);
    return;
  }

  const n = normalize(text);

  /* garde-fou conseil vétérinaire / médicaments : intercepté AVANT le reste */
  if(normalizedIncludesAny(n,['medicament','medicamento','medicine','pastilla','pill','antibiotic','antibiotico','ibuprofen','paracetamol','que le doy','que le dono','what should i give','que dois-je donner','remedio','remei','dosi','dosis','dose','tratamiento en casa'])){
    showNoMedical(); return;
  }

  if(normalizedIncludesAny(n,['urgenci','urgence','emergency','molt malament','muy mal','tres mal','se muere','es mor','convuls','sagn','sangr','hemorr','veneno','toxic','atropell','no respira'])){ showUrgency(); return; }
  if(normalizedIncludesAny(n,['cita','pedir','hora','demanar','reservar','appointment','book','rendez','rdv','vacuna','vaccin','revisio','revision','control','contrôle','controle','check'])){ startBooking(); return; }
  if(normalizedIncludesAny(n,['horario','horari','hours','horaire','abierto','obert','open','ouvert','cerrado','tancat','ferme'])){ showHours(); return; }
  if(normalizedIncludesAny(n,['direccion','adreca','address','acces','como llegar','com arribar','directions','venir','parking','aparcamiento'])){ showAccess(); return; }
  if(normalizedIncludesAny(n,['primera visita','first visit','premiere visite','primera','cartilla','carnet'])){ showFirstVisit(); return; }
  if(normalizedIncludesAny(n,['whatsapp','humano','human','humain','persona','equipo','equip','equipe','llamar','call','telefono','telefon','appeler'])){ humanHandoff(); return; }
  if(normalizedIncludesAny(n,['hola','buenas','bon dia','bona tarda','hello','hi','hey','bonjour','salut','bonsoir'])){
    addBotText(t('welcome'), mainMenuButtons(), 400); return;
  }

  addBotText(t('fallback'), mainMenuButtons(), 450);
}

function handleSend(){
  const val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){
    const d = detectLang(val) || 'ca';
    forceLangSilent(d);
  }
  handleFreeText(val);
}

inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

/* ================= VISIT PING ================= */
try{
  if(location.hash !== '#test'){
    const device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    fetch('https://ntfy.sh/agentia-demo-gomisverges-8q4r', {method:'POST', body:'Visite demo Vet Gomis-Verges · '+device+' · '+(navigator.language||'?')});
  }
}catch(e){}

function init(){
  lang = 'ca';
  document.querySelector('.langbtn[data-lang="ca"]').classList.add('active');
  addBotText(t('welcome'), mainMenuButtons(), 200);
}
init();
