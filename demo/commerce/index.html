<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ALEX · Démonstration assistant commerce</title>
<meta name="description" content="Démonstration d'ALEX, l'assistant qui répond à vos clients 24h/24 : horaires, prix, prise de rendez-vous — et capte les contacts.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<style>
:root{
  --navy:#0f2a4a;--navy-dark:#0a1c33;--blue:#1d6fd1;--blue-dark:#155096;
  --amber:#16b364;--amber-dark:#0e8a4c;--bg:#eef2f6;--paper:#ffffff;--ink:#18242f;--muted:#7a8894;--radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%, #1a4570 0%, var(--navy) 55%, var(--navy-dark) 100%);
  min-height:100%;display:flex;justify-content:center;color:var(--ink);}
#app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,.35);}
#demoBanner{background:var(--amber);color:#052e1a;font-size:11.5px;font-weight:700;text-align:center;padding:5px 10px;letter-spacing:.4px;}
header{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--amber-dark));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15px;line-height:1.25;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
#chat{flex:1;overflow-y:auto;padding:16px 12px 12px;display:flex;flex-direction:column;gap:10px;}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{max-width:84%;padding:10px 13px;border-radius:var(--radius);font-size:14.5px;line-height:1.45;white-space:pre-wrap;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.row.bot .bubble{background:var(--paper);border-bottom-left-radius:4px;color:var(--ink);}
.row.user .bubble{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border-bottom-right-radius:4px;}
.bubble b{color:var(--blue-dark);}
.row.user .bubble b{color:#fff;}
.card{background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #dde5ec;}
.card .cardhead{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.card .cardhead .cname{font-weight:700;font-size:14.5px;}
.card .cardbody{padding:10px 12px;font-size:13.5px;color:var(--ink);}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{background:#fff;border:1.5px solid var(--amber);color:var(--amber-dark);font-size:13px;font-weight:600;padding:8px 12px;border-radius:20px;cursor:pointer;transition:.15s;}
.qbtn:hover{background:var(--amber);color:#fff;}
.qbtn.primary{background:var(--blue);border-color:var(--blue-dark);color:#fff;}
.qbtn.primary:hover{background:var(--blue-dark);}
.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
#inputbar{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid #e2e9ee;position:sticky;bottom:0;}
#msgInput{flex:1;border:1.5px solid #d5dee6;background:var(--bg);border-radius:22px;padding:11px 16px;font-size:14.5px;outline:none;color:var(--ink);}
#msgInput:focus{border-color:var(--blue);}
#sendBtn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(21,80,150,.4);}
#sendBtn:active{transform:scale(.93);}
.footerbadge{text-align:center;font-size:10.5px;color:var(--muted);padding:7px 10px 4px;background:var(--paper);line-height:1.5;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#c6d1da;border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <div id="demoBanner">⚠️ DÉMONSTRATION — réponses préconfigurées à titre d'exemple</div>
  <header>
    <div class="avatar">💬</div>
    <div class="hinfo">
      <div class="name" id="headerName">ALEX · assistant de votre commerce</div>
      <div class="status"><span class="dot"></span><span>disponible 24h/24 · répond en 4 langues</span></div>
    </div>
  </header>
  <div id="chat"></div>
  <div id="inputbar">
    <input id="msgInput" type="text" placeholder="Écrivez comme un client…" autocomplete="off" />
    <button id="sendBtn" onclick="handleSend()">➤</button>
  </div>
  <div class="footerbadge">Démonstration illustrative · propulsé par ALEX · alexagent.io</div>
</div>
<script>
const SOC_LABEL = "votre commerce";
const T = {
  welcome:"Bonjour ! 👋 Je suis *ALEX*, l'assistant de ce commerce. Je réponds à vos clients **24h/24, en 4 langues** — même quand c'est fermé.\n\nCeci est une **démonstration** : écrivez comme le ferait un client, ou choisissez 👇",
  menu:["🕐 Horaires & infos","💶 Prix / devis","📅 Prendre rendez-vous","📞 Être rappelé"],
  fallback:"Bonne question ! Dans cette démo je peux montrer comment je gère : *horaires & infos*, *un prix / devis*, *une prise de rendez-vous* ou *un rappel*. Configuré pour " + SOC_LABEL + ", je répondrais avec ses vraies infos. Que voulez-vous voir ?",
  hoStart:"Avec plaisir 🙌 C'est LA question qui tombe le soir ou le dimanche — j'y réponds en une seconde.",
  hoAnswer:"Voici ce que je répondrais instantanément :\n\n🕐 **Horaires du jour** (et jours fériés)\n📍 **Adresse + itinéraire**\n🅿️ Parking, accès, moyens de paiement\n\n_Le client a sa réponse tout de suite — il ne va pas voir ailleurs._",
  hoBtns:["💶 Voir un prix","📅 Prendre RDV","🔄 Menu"],
  prStart:"Je gère ça direct 💪 Que voulez-vous savoir ?",
  prOpts:["Un tarif / une prestation","Un devis","Une dispo produit","Autre"],
  prAnswer:"Voici comment je réagirais :\n\n1️⃣ **Je donne le prix ou la fourchette** tout de suite.\n2️⃣ Pour un devis, **je pose 2-3 questions** et je récupère le contact.\n3️⃣ **Je transmets la demande qualifiée** au patron — plus de client perdu faute de réponse.\n\n_80 % des questions se règlent sans vous déranger._",
  prBtns:["📅 Prendre RDV","📞 Être rappelé","🔄 Menu"],
  rvStart:"Bien sûr ! Exemple de prise de RDV automatique 👇",
  rvAskWhen:"📅 Quand souhaitez-vous venir ?",
  rvWhenOpts:["Aujourd'hui","Cette semaine","Ce week-end","Plus tard"],
  rvAskName:"🙋 À quel prénom je note le rendez-vous ?",
  rvAskPhone:"📱 Merci {name} ! Un numéro pour confirmer le RDV ?",
  rvSummaryTitle:"📅 Nouveau rendez-vous (exemple)",
  rvSumWhen:"Créneau", rvSumName:"Prénom", rvSumPhone:"Téléphone",
  rvSummaryFooter:"✅ En vrai, ce RDV s'ajoute à votre agenda et vous êtes prévenu par WhatsApp. Un client capté un dimanche soir = une vente de plus.",
  rpStart:"Pas de souci 🙌 Je prends vos coordonnées et le patron vous rappelle.",
  rpAskName:"🙋 Votre prénom ?",
  rpAskPhone:"📱 Merci {name} ! Votre numéro ?",
  rpSummaryTitle:"📞 Demande de rappel (exemple)",
  rpSumName:"Prénom", rpSumPhone:"Téléphone",
  rpSummaryFooter:"✅ En vrai, cette fiche arrive tout de suite au patron par WhatsApp/email. Le client est rappelé — plus aucune demande perdue.",
  newQuery:"🔄 Recommencer"
};
let deal=null;
const chatEl=document.getElementById('chat');const inputEl=document.getElementById('msgInput');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/_(.+?)_/g,'<i>$1</i>').replace(/\*(.+?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');}
function scrollBottom(){requestAnimationFrame(()=>{chatEl.scrollTop=chatEl.scrollHeight;});}
function addUser(t){const r=document.createElement('div');r.className='row user';r.innerHTML=`<div class="bubble">${md(t)}</div>`;chatEl.appendChild(r);scrollBottom();}
function showTyping(cb,d){const r=document.createElement('div');r.className='row bot';r.innerHTML=`<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;chatEl.appendChild(r);scrollBottom();setTimeout(()=>{r.remove();cb();},d||550);}
function addBot(html,btns){const r=document.createElement('div');r.className='row bot';let b='';if(btns&&btns.length){b=`<div class="quick">${btns.map(x=>`<button class="qbtn ${x.cls||''}" onclick="${x.onclick}">${esc(x.label)}</button>`).join('')}</div>`;}r.innerHTML=`<div class="stack"><div class="bubble">${html}</div>${b?`<div style="margin-top:6px">${b}</div>`:''}</div>`;chatEl.appendChild(r);scrollBottom();}
function addBotText(t,btns,d){showTyping(()=>addBot(md(t),btns),d);}
function q(s){return s.replace(/'/g,"\\'");}
function mainMenuButtons(){return[{label:T.menu[0],onclick:"startHo()"},{label:T.menu[1],onclick:"startPr()"},{label:T.menu[2],onclick:"startRv()",cls:"primary"},{label:T.menu[3],onclick:"startRp()"}];}
function resetChat(){deal=null;addBotText(T.welcome,mainMenuButtons(),300);}
function backMenu(){addUser("🔄 Menu");resetChat();}
function startHo(){addUser(T.menu[0]);addBotText(T.hoStart,null,350);setTimeout(()=>addBotText(T.hoAnswer,[{label:T.hoBtns[0],onclick:"startPr()"},{label:T.hoBtns[1],onclick:"startRv()",cls:"primary"},{label:T.hoBtns[2],onclick:"backMenu()"}]),800);}
function startPr(){addUser(T.menu[1]);addBotText(T.prStart,T.prOpts.map(l=>({label:l,onclick:`pickPr('${q(l)}')`})),450);}
function pickPr(l){addUser(l);addBotText(T.prAnswer,[{label:T.prBtns[0],onclick:"startRv()",cls:"primary"},{label:T.prBtns[1],onclick:"startRp()"},{label:T.prBtns[2],onclick:"backMenu()"}],650);}
function startRv(){addUser(T.menu[2]);deal={flow:'rv',step:'when'};addBotText(T.rvStart,null,350);setTimeout(()=>addBotText(T.rvAskWhen,T.rvWhenOpts.map(l=>({label:l,onclick:`pickRvWhen('${q(l)}')`}))),800);}
function pickRvWhen(l){addUser(l);deal.when=l;deal.step='name';addBotText(T.rvAskName,null,450);}
function startRp(){addUser(T.menu[3]);deal={flow:'rp',step:'name'};addBotText(T.rpStart,null,350);setTimeout(()=>addBotText(T.rpAskName,null,450),700);}
function dealText(t){
  if(!deal)return false;
  if(deal.step==='name'){deal.name=t;deal.step='phone';addBotText((deal.flow==='rv'?T.rvAskPhone:T.rpAskPhone).replace('{name}',t),null,400);return true;}
  if(deal.step==='phone'){deal.phone=t;finish();return true;}
  return false;
}
function finish(){
  const rv=deal.flow==='rv';deal.step='done';
  showTyping(()=>{
    const r=document.createElement('div');r.className='row bot';
    const rows = rv
      ? `<b>${T.rvSumWhen} :</b> ${esc(deal.when)}<br><b>${T.rvSumName} :</b> ${esc(deal.name)}<br><b>${T.rvSumPhone} :</b> ${esc(deal.phone)}`
      : `<b>${T.rpSumName} :</b> ${esc(deal.name)}<br><b>${T.rpSumPhone} :</b> ${esc(deal.phone)}`;
    r.innerHTML=`<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%"><div class="card"><div class="cardhead"><span class="cname">${esc(rv?T.rvSummaryTitle:T.rpSummaryTitle)}</span></div><div class="cardbody">${rows}<hr style="border:none;border-top:1px solid #e2e9ee;margin:8px 0"><span style="font-size:12px;color:var(--muted)">${esc(rv?T.rvSummaryFooter:T.rpSummaryFooter)}</span><div class="demo-note">ℹ️ Démonstration — aucune donnée n'est transmise ni enregistrée.</div></div></div></div>`;
    chatEl.appendChild(r);scrollBottom();
    addBot('',[{label:T.newQuery,onclick:"resetChat()"}]);chatEl.lastChild.querySelector('.bubble').style.display='none';
  },600);
}
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function nIncludes(n,a){return a.some(w=>n.includes(w));}
function handleFreeText(raw){
  const t=raw.trim();if(!t)return;addUser(t);inputEl.value='';
  if(deal&&(deal.step==='name'||deal.step==='phone')){dealText(t);return;}
  const n=normalize(t);
  if(nIncludes(n,['rdv','rendez','reserv','booking','venir','creneau'])){startRv();return;}
  if(nIncludes(n,['rappel','rappeler','telephone','appel','contact'])){startRp();return;}
  if(nIncludes(n,['prix','tarif','devis','cout','combien','payer'])){startPr();return;}
  if(nIncludes(n,['horaire','ouvert','ferme','adresse','ou etes','parking','acces'])){startHo();return;}
  if(nIncludes(n,['bonjour','salut','bonsoir','hello','coucou','hola','hi'])){addBotText(T.welcome,mainMenuButtons(),400);return;}
  if(nIncludes(n,['langue','anglais','espagnol','english','espanol'])){addBotText("Yes! 🇬🇧 ¡Claro! 🇪🇸 Natürlich! 🇩🇪\n\nJe détecte la langue du client et je réponds dans SA langue. Ici la démo reste en français pour rester simple.",mainMenuButtons(),500);return;}
  addBotText(T.fallback,mainMenuButtons(),500);
}
function handleSend(){const v=inputEl.value;if(!v.trim())return;handleFreeText(v);}
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')handleSend();});
try{if(location.hash!=='#test'){const d=/Mobi|Android|iPhone/i.test(navigator.userAgent)?'mobile':'desktop';fetch('https://ntfy.sh/alex-demo-commerce-x7k2p9',{method:'POST',body:'Visite demo Commerce · '+d+' · '+(navigator.language||'?')});}}catch(e){}
addBotText(T.welcome,mainMenuButtons(),250);
</script>
</body>
</html>
