<title>Alex · Le Fil à l'Immo</title>

<style>
:root{
  --navy:#12314a;
  --navy-dark:#0c2033;
  --teal:#1f6f78;
  --teal-dark:#155159;
  --gold:#c39a4d;
  --gold-dark:#a17c33;
  --bg:#eef2f3;
  --paper:#ffffff;
  --ink:#1b2a33;
  --muted:#7b8a92;
  --wa:#25d366;
  --wa-dark:#1ebe5b;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1c4a63 0%, var(--navy) 55%, var(--navy-dark) 100%);
  min-height:100%;
  display:flex;
  justify-content:center;
  color:var(--ink);
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.35);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--teal) 100%);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15.5px;line-height:1.2;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.langbar{display:flex;gap:4px;}
.langbtn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:.3px;
}
.langbtn.active{background:#fff;color:var(--teal-dark);}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(var(--bg),var(--bg));
}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{
  max-width:84%;
  padding:10px 13px;
  border-radius:var(--radius);
  font-size:14.5px;
  line-height:1.45;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.row.bot .bubble{
  background:var(--paper);
  border-bottom-left-radius:4px;
  color:var(--ink);
}
.row.user .bubble{
  background:linear-gradient(135deg,var(--teal),var(--navy));
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble b{color:var(--teal-dark);}
.row.user .bubble b{color:#fff;}

.card{
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  border:1px solid #dfe6e8;
}
.card .cardhead{
  background:linear-gradient(135deg,var(--navy),var(--teal));
  color:#fff;padding:9px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card .cardhead .cname{font-weight:700;font-size:14.5px;}
.card .cardhead .cprice{font-size:12.5px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.card .cardbody{padding:10px 12px;font-size:13.5px;color:var(--ink);}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{
  background:#fff;
  border:1.5px solid var(--gold);
  color:var(--gold-dark);
  font-size:13px;
  font-weight:600;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:.15s;
}
.qbtn:hover{background:var(--gold);color:#fff;}
.qbtn.primary{background:var(--teal);border-color:var(--teal-dark);color:#fff;}
.qbtn.primary:hover{background:var(--teal-dark);}
.qbtn.wa{background:var(--wa);border-color:var(--wa-dark);color:#fff;}
.qbtn.wa:hover{background:var(--wa-dark);}

.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

/* input bar */
#inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid #e4eaeb;
  position:sticky;
  bottom:0;
}
#msgInput{
  flex:1;
  border:1.5px solid #d8e0e2;
  background:var(--bg);
  border-radius:22px;
  padding:11px 16px;
  font-size:14.5px;
  outline:none;
  color:var(--ink);
}
#msgInput:focus{border-color:var(--teal);}
#sendBtn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(21,81,89,.4);
}
#sendBtn:active{transform:scale(.93);}

.footerbadge{
  text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 2px;
  background:var(--paper);
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#c8d2d5;border-radius:3px;}
</style>
</head>

/* ================= STATE ================= */
let lang = null;
let deal = null; // {type, step, sector, bien, criteria, rdv, name, phone}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function t(key){ return (S[lang]||S.fr)[key]; }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(str){
  return esc(str)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/_(.+?)_/g,'<i>$1</i>')
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  const row = document.createElement('div');
  row.className='row user';
  row.innerHTML = `<div class="bubble">${md(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  const row = document.createElement('div');
  row.className='row bot';
  row.id='typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(()=>{
    row.remove();
    cb();
  }, delay || 550);
}

function addBot(html, buttons){
  const row = document.createElement('div');
  row.className='row bot';
  let btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = `<div class="quick">${buttons.map(b=>`<button class="qbtn ${b.cls||''}" onclick="${b.onclick}">${esc(b.label)}</button>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="stack"><div class="bubble">${html}</div>${btnHtml ? `<div style="margin-top:6px">${btnHtml}</div>` : ''}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addBotText(text, buttons, delay){
  showTyping(()=>addBot(md(text), buttons), delay);
}

    {label:m[0], onclick:"startDeal('buy')", cls:"primary"},
    {label:m[1], onclick:"startDeal('sell')"},
    {label:m[2], onclick:"startDeal('estimate')"},
    {label:m[3], onclick:"humanHandoff()", cls:"wa"}
  ];
}

function backLabel(){ return t('backMenu'); }

function showMenu(){
  deal = null;
  addBotText(t('welcome').split('\n').slice(1).join('\n') || t('welcome'), mainMenuButtons(), 300);
}

/* ================= QUALIFICATION / RDV ================= */
function q(str){ return str.replace(/'/g,"\\'"); }

function startDeal(type){
  const m = t('menu');
  const idx = {buy:0, sell:1, estimate:2}[type];
  addUser(m[idx]);
  deal = {type, step:'sector', sector:null, bien:null, criteria:null, rdv:null, name:null, phone:null};
  const intro = type==='buy' ? t('buyStart') : type==='sell' ? t('sellStart') : t('estimateStart');
  addBotText(intro, null, 300);
  setTimeout(()=>{
    const askKey = type==='buy' ? 'askSector' : 'askSectorSell';
    addBotText(t(askKey), t('sectorOpts').map(l=>({label:l, onclick:`dealSector('${q(l)}')`})));
  }, 750);
}

function dealSector(label){
  addUser(label);
  deal.sector = label;
  deal.step='bien';
  const askKey = deal.type==='buy' ? 'askBienBuy' : 'askBienSell';
  addBotText(t(askKey), t('bienOpts').map(l=>({label:l, onclick:`dealBien('${q(l)}')`})), 450);
}

function dealBien(label){
  addUser(label);
  deal.bien = label;
  deal.step='criteria';
  if(deal.type==='buy'){
    addBotText(t('askBudget'), t('budgetOpts').map(l=>({label:l, onclick:`dealCriteria('${q(l)}')`})), 450);
  }else{
    addBotText(t('askSurface'), t('surfaceOpts').map(l=>({label:l, onclick:`dealCriteria('${q(l)}')`})), 450);
  }
}

function dealCriteria(label){
  addUser(label);
  deal.criteria = label;
  deal.step='rdv';
  addBotText(t('askRdv'), t('rdvOpts').map(l=>({label:l, onclick:`dealRdv('${q(l)}')`})), 450);
}

function dealRdv(label){
  addUser(label);
  deal.rdv = label;
  deal.step='name';
  addBotText(t('askName'), null, 450);
}

function dealHandleText(text){
  if(!deal) return false;
  if(deal.step==='name'){
    deal.name = text;
    deal.step='phone';
    addBotText(t('askPhone').replace('{name}', text), null, 400);
    return true;
  }
  if(deal.step==='phone'){
    deal.phone = text;
    finishDeal();
    return true;
  }
  return false;
}

function projLabel(){
  return deal.type==='buy' ? t('projBuy') : deal.type==='sell' ? t('projSell') : t('projEstimate');
}

function finishDeal(){
  deal.step='done';
  const critLabel = deal.type==='buy' ? t('summaryCriteria') : t('summaryCriteriaSell');
  showTyping(()=>{
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">
      <div class="card">
        <div class="cardhead"><span class="cname">${t('summaryTitle')}</span></div>
        <div class="cardbody">
          <b>${t('summaryProject')} :</b> ${esc(projLabel())}<br>
          <b>${t('summarySector')} :</b> ${esc(deal.sector)}<br>
          <b>${t('summaryBien')} :</b> ${esc(deal.bien)}<br>
          <b>${esc(critLabel)} :</b> ${esc(deal.criteria)}<br>
          <b>${t('summaryRdv')} :</b> ${esc(deal.rdv)}<br>
          <b>${t('summaryName')} :</b> ${esc(deal.name)}<br>
          <b>${t('summaryPhone')} :</b> ${esc(deal.phone)}
          <hr style="border:none;border-top:1px solid #e2e9ea;margin:8px 0">
          <span style="font-size:12px;color:var(--muted)">${esc(t('summaryFooter'))}</span>
          <div class="demo-note">ℹ️ Contenu illustratif présenté à titre de démonstration.</div>
        </div>
      </div></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    const waText = `${t('waPrefix')}\n${t('summaryProject')}: ${projLabel()}\n${t('summarySector')}: ${deal.sector}\n${t('summaryBien')}: ${deal.bien}\n${critLabel}: ${deal.criteria}\n${t('summaryRdv')}: ${deal.rdv}\n${t('summaryName')}: ${deal.name}\n${t('summaryPhone')}: ${deal.phone}`;
    addBot('', [
      {label:t('sendWa'), onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}','_blank')`, cls:'wa'},
      {label:t('newQuery'), onclick:"resetChat()"}
    ]);
    chatEl.lastChild.querySelector('.bubble').style.display='none';
  }, 600);
}

/* ================= HANDOFF HUMAIN ================= */
function humanHandoff(){
  addUser(t('menu')[3]);
  addBotText(t('humanHandoff'), [
    {label:"💬 WhatsApp", onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t('waPrefix'))}','_blank')`, cls:'wa'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

function resetChat(){
  deal = null;
  addBotText(t('welcome'), mainMenuButtons(), 300);
}

/* ================= LANGUE ================= */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function detectLang(text){
  const n = normalize(text);
  const fr = ['bonjour','salut','bonsoir','acheter','vendre','estimer','estimation','villa','appartement','maison','bien','budget','lac','visite','rendez','merci','oui','non','recherche'];
  const en = ['hello','hi ','hey','buy','sell','estimate','valuation','villa','apartment','house','property','budget','lake','viewing','appointment','thanks','yes','no ','looking'];
  const es = ['hola','buenas','comprar','vender','valorar','valoracion','villa','piso','casa','propiedad','presupuesto','lago','visita','cita','gracias','si','busco'];
  const ca = ['hola','bon dia','comprar','vendre','valorar','valoracio','vila','pis','casa','propietat','pressupost','llac','visita','cita','gracies','vull','cerco'];
  let scores = {fr:0,en:0,es:0,ca:0};
  fr.forEach(w=>{ if(n.includes(w)) scores.fr++; });
  en.forEach(w=>{ if(n.includes(w)) scores.en++; });
  es.forEach(w=>{ if(n.includes(w)) scores.es++; });
  ca.forEach(w=>{ if(n.includes(w)) scores.ca++; });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0 ? best[0] : null;
}

function forceLang(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = '';
  deal = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
}

function forceLangSilent(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ================= TEXTE LIBRE ================= */
function normalizedIncludesAny(n, arr){ return arr.some(w=>n.includes(w)); }

function handleFreeText(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value='';

  if(deal && (deal.step==='name'||deal.step==='phone')){
    dealHandleText(text);
    return;
  }

  const n = normalize(text);

  if(normalizedIncludesAny(n,['estim','valorar','valoracio','valuation'])){ startDeal('estimate'); return; }
  if(normalizedIncludesAny(n,['vendre','vender','sell','vente','venda'])){ startDeal('sell'); return; }
  if(normalizedIncludesAny(n,['achet','acquer','buy','compra','comprar','recherch','looking','busco','cerco','villa','appartement','apartment','piso','maison','house','casa','bien','propiet','propied'])){ startDeal('buy'); return; }
  if(normalizedIncludesAny(n,['whatsapp','humain','human','humano','conseiller','asesor','equipe','equipo','equip','appeler','llamar','call','telephone','agent'])){ humanHandoff(); return; }
  if(normalizedIncludesAny(n,['bonjour','salut','bonsoir','hola','buenas','hello','hi','hey','bon dia'])){
    addBotText(t('welcome'), mainMenuButtons(), 400); return;
  }

  addBotText(t('fallback'), mainMenuButtons(), 450);
}

function handleSend(){
  const val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){
    const d = detectLang(val) || 'fr';
    forceLangSilent(d);
  }
  handleFreeText(val);
}

inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

/* ================= VISIT PING ================= */
try{
  if(location.hash !== '#test'){
    const device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    fetch('https://ntfy.sh/agentia-demo-filalimmo-c4x6', {method:'POST', body:'Visite demo Le Fil a l Immo (Nancy) · '+device+' · '+(navigator.language||'?')});
  }
}catch(e){}

/* ================= INIT ================= */
function init(){
  lang = 'fr';
  document.querySelector('.langbtn[data-lang="fr"]').classList.add('active');
  addBotText(t('welcome'), mainMenuButtons(), 200);
}
init();
</script>
