<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Alex · Haussmann Prestige</title>
<meta name="description" content="Alex, l'assistant virtuel de Haussmann Prestige — acheter, vendre ou estimer un bien de prestige à Paris, et convenir d'un rendez-vous privé.">
<style>
:root{
  --navy:#132741;
  --navy-dark:#0a1626;
  --royal:#1c3a5e;
  --gold:#c2a05a;
  --gold-dark:#9c7d3f;
  --gold-soft:#e7d7ac;
  --bg:#f4f1ea;
  --paper:#fffefb;
  --ink:#22303f;
  --muted:#8a8577;
  --wa:#25d366;
  --wa-dark:#1ebe5b;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 620px at 50% -12%, #22456e 0%, var(--navy) 55%, var(--navy-dark) 100%);
  min-height:100%;
  display:flex;
  justify-content:center;
  color:var(--ink);
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.4);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--navy-dark) 0%,var(--royal) 100%);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 12px rgba(0,0,0,.22);
  border-bottom:1px solid rgba(194,160,90,.35);
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:19px;flex-shrink:0;color:var(--navy-dark);font-weight:800;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15.5px;line-height:1.2;letter-spacing:.2px;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.langbar{display:flex;gap:4px;}
.langbtn{
  border:1px solid rgba(194,160,90,.5);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:.3px;
}
.langbtn.active{background:var(--gold);color:var(--navy-dark);border-color:var(--gold);}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(var(--bg),var(--bg));
}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{
  max-width:84%;
  padding:10px 13px;
  border-radius:var(--radius);
  font-size:14.5px;
  line-height:1.45;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.row.bot .bubble{
  background:var(--paper);
  border-bottom-left-radius:4px;
  color:var(--ink);
  border:1px solid #ece5d6;
}
.row.user .bubble{
  background:linear-gradient(135deg,var(--royal),var(--navy));
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble b{color:var(--gold-dark);}
.row.user .bubble b{color:var(--gold-soft);}

.card{
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.1);
  border:1px solid #e6dcc6;
}
.card .cardhead{
  background:linear-gradient(135deg,var(--navy-dark),var(--royal));
  color:#fff;padding:10px 13px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid rgba(194,160,90,.4);
}
.card .cardhead .cname{font-weight:700;font-size:14.5px;letter-spacing:.2px;}
.card .cardhead .cprice{font-size:12px;background:rgba(194,160,90,.28);color:var(--gold-soft);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.card .cardbody{padding:11px 13px;font-size:13.8px;color:var(--ink);line-height:1.55;}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{
  background:#fff;
  border:1.5px solid var(--gold);
  color:var(--gold-dark);
  font-size:13px;
  font-weight:600;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:.15s;
}
.qbtn:hover{background:var(--gold);color:var(--navy-dark);}
.qbtn.primary{background:var(--navy);border-color:var(--navy-dark);color:#fff;}
.qbtn.primary:hover{background:var(--navy-dark);}
.qbtn.wa{background:var(--wa);border-color:var(--wa-dark);color:#fff;}
.qbtn.wa:hover{background:var(--wa-dark);}

.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

/* input bar */
#inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid #ece4d4;
  position:sticky;
  bottom:0;
}
#msgInput{
  flex:1;
  border:1.5px solid #e2d9c6;
  background:var(--bg);
  border-radius:22px;
  padding:11px 16px;
  font-size:14.5px;
  outline:none;
  color:var(--ink);
}
#msgInput:focus{border-color:var(--gold);}
#sendBtn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:var(--navy-dark);font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(156,125,63,.4);
}
#sendBtn:active{transform:scale(.93);}

.footerbadge{
  text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 2px;
  background:var(--paper);
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#dccbb0;border-radius:3px;}
</style>
</head>

/* ================= STATE ================= */
let lang = null;
let booking = null; // {projet, step, quartier, bien, rdv, name, phone}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function t(key){ return (S[lang]||S.fr)[key]; }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(str){
  return esc(str)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  const row = document.createElement('div');
  row.className='row user';
  row.innerHTML = `<div class="bubble">${md(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  const row = document.createElement('div');
  row.className='row bot';
  row.id='typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(()=>{
    row.remove();
    cb();
  }, delay || 550);
}

function addBot(html, buttons){
  const row = document.createElement('div');
  row.className='row bot';
  let btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = `<div class="quick">${buttons.map(b=>`<button class="qbtn ${b.cls||''}" onclick="${b.onclick}">${esc(b.label)}</button>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="stack"><div class="bubble">${html}</div>${btnHtml ? `<div style="margin-top:6px">${btnHtml}</div>` : ''}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addBotText(text, buttons, delay){
  showTyping(()=>addBot(md(text), buttons), delay);
}

/* ================= MENU (navigation) ================= */
function mainMenuButtons(){
  const m = t('menu');
  return [
    {label:m[0], onclick:"startQualif('buy')", cls:"primary"},
    {label:m[1], onclick:"startQualif('sell')"},
    {label:m[2], onclick:"startQualif('estimate')"},
    {label:m[3], onclick:"humanHandoff()", cls:"wa"}
  ];
}

function backLabel(){ return "⬅️ "+t('menuLabel'); }

function showMenu(){
  addBotText(t('welcome').split('\n').slice(1).join('\n') || t('welcome'), mainMenuButtons(), 300);
}

/* ================= HANDOFF HUMAIN ================= */
function humanHandoff(){
  addUser(t('menu')[3]);
  addBotText(t('humanHandoff'), [
    {label:"💬 WhatsApp", onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t('waPrefix'))}','_blank')`, cls:'wa'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

/* ================= QUALIFICATION / RDV ================= */
function projetIndex(p){ return {buy:0,sell:1,estimate:2}[p]; }
function projetIntro(p){ return {buy:t('introBuy'),sell:t('introSell'),estimate:t('introEstimate')}[p]; }

function startQualif(projet){
  addUser(t('menu')[projetIndex(projet)]);
  booking = {projet, step:'quartier', quartier:null, bien:null, rdv:null, name:null, phone:null};
  addBotText(projetIntro(projet), null, 300);
  setTimeout(()=>{
    addBotText(t('askQuartier'), t('quartierOpts').map(l=>({label:l, onclick:`bookingQuartier('${l.replace(/'/g,"\\'")}')`})));
  }, 750);
}

function bookingQuartier(label){
  addUser(label);
  booking.quartier = label;
  booking.step='bien';
  askBien(450);
}

function askBien(delay){
  if(booking.projet==='buy'){
    addBotText(t('askBudget'), t('budgetOpts').map(l=>({label:l, onclick:`bookingBien('${l.replace(/'/g,"\\'")}')`})), delay);
  }else{
    addBotText(t('askType'), t('typeOpts').map(l=>({label:l, onclick:`bookingBien('${l.replace(/'/g,"\\'")}')`})), delay);
  }
}

function bookingBien(label){
  addUser(label);
  booking.bien = label;
  booking.step='rdv';
  const opts = booking.projet==='buy' ? t('rdvOptsBuy') : t('rdvOptsAdvisor');
  addBotText(t('askRdv'), opts.map(l=>({label:l, onclick:`bookingRdv('${l.replace(/'/g,"\\'")}')`})), 450);
}

function bookingRdv(label){
  addUser(label);
  booking.rdv = label;
  booking.step='name';
  addBotText(t('askName'), null, 450);
}

function bookingHandleText(text){
  if(!booking) return false;
  if(booking.step==='name'){
    booking.name = text;
    booking.step='phone';
    addBotText(t('askPhone').replace('{name}', text), null, 400);
    return true;
  }
  if(booking.step==='phone'){
    booking.phone = text;
    finishBooking();
    return true;
  }
  return false;
}

function finishBooking(){
  booking.step='done';
  const projetLabel = t('projetWords')[booking.projet];
  showTyping(()=>{
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;border:none;max-width:94%">
      <div class="card">
        <div class="cardhead"><span class="cname">${t('summaryTitle')}</span><span class="cprice">Haussmann Prestige</span></div>
        <div class="cardbody">
          <b>${t('summaryProjet')} :</b> ${esc(projetLabel)}<br>
          <b>${t('summaryQuartier')} :</b> ${esc(booking.quartier)}<br>
          <b>${t('summaryBien')} :</b> ${esc(booking.bien)}<br>
          <b>${t('summaryRdv')} :</b> ${esc(booking.rdv)}<br>
          <b>${t('summaryName')} :</b> ${esc(booking.name)}<br>
          <b>${t('summaryPhone')} :</b> ${esc(booking.phone)}
          <hr style="border:none;border-top:1px solid #ede4d0;margin:9px 0">
          <span style="font-size:12px;color:var(--muted)">${esc(t('summaryFooter'))}</span>
        </div>
      </div></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    const waText = `${t('waPrefix')}\n${t('summaryProjet')}: ${projetLabel}\n${t('summaryQuartier')}: ${booking.quartier}\n${t('summaryBien')}: ${booking.bien}\n${t('summaryRdv')}: ${booking.rdv}\n${t('summaryName')}: ${booking.name}\n${t('summaryPhone')}: ${booking.phone}`;
    addBot('', [
      {label:t('sendWa'), onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}','_blank')`, cls:'wa'},
      {label:t('newQuery'), onclick:"resetChat()"}
    ]);
    chatEl.lastChild.querySelector('.bubble').style.display='none';
  }, 600);
}

function resetChat(){
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 300);
}

/* ================= LANGUE ================= */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function detectLang(text){
  const n = normalize(text);
  const fr = ['bonjour','salut','bonsoir','acheter','achat','vendre','vente','estimer','estimation','appartement','maison','hotel particulier','quartier','budget','visite','rendez-vous','merci','oui','non'];
  const en = ['hello','hi ','hey','buy','buying','sell','selling','estimate','valuation','apartment','mansion','area','budget','viewing','appointment','thanks','yes','no '];
  const es = ['hola','buenas','comprar','compra','vender','venta','valorar','valoracion','piso','palacete','zona','presupuesto','visita','cita','gracias','si','no '];
  const ca = ['hola','bona tarda','comprar','vendre','venda','valorar','valoracio','pis','palauet','zona','pressupost','visita','cita','gracies','vull','voldria'];
  let scores = {fr:0,en:0,es:0,ca:0};
  fr.forEach(w=>{ if(n.includes(w)) scores.fr++; });
  en.forEach(w=>{ if(n.includes(w)) scores.en++; });
  es.forEach(w=>{ if(n.includes(w)) scores.es++; });
  ca.forEach(w=>{ if(n.includes(w)) scores.ca++; });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0 ? best[0] : null;
}

function forceLang(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = '';
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
}

function forceLangSilent(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ================= TEXTE LIBRE ================= */
function normalizedIncludesAny(n, arr){ return arr.some(w=>n.includes(w)); }

function handleFreeText(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value='';

  if(booking && (booking.step==='name'||booking.step==='phone')){
    bookingHandleText(text);
    return;
  }

  const n = normalize(text);

  if(normalizedIncludesAny(n,['achet','achat','buy','buying','comprar','compra','acquisition'])){ startQualif('buy'); return; }
  if(normalizedIncludesAny(n,['vendre','vente','sell','selling','vender','venda'])){ startQualif('sell'); return; }
  if(normalizedIncludesAny(n,['estim','valuation','valorar','valoraci','prix','price','combien vaut','worth'])){ startQualif('estimate'); return; }
  if(normalizedIncludesAny(n,['humain','human','humano','conseiller','advisor','asesor','assessor','whatsapp','appeler','llamar','call','telephone','agent'])){ humanHandoff(); return; }
  if(normalizedIncludesAny(n,['bonjour','salut','bonsoir','hola','buenas','hello','hi','hey'])){
    addBotText(t('welcome'), mainMenuButtons(), 400); return;
  }

  addBotText(t('fallback'), mainMenuButtons(), 450);
}

function handleSend(){
  const val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){
    const d = detectLang(val) || 'fr';
    forceLangSilent(d);
  }
  handleFreeText(val);
}

inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

/* ================= VISIT PING ================= */
try{
  if(location.hash !== '#test'){
    const device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    fetch('https://ntfy.sh/agentia-demo-haussmannprestige-b2v9', {method:'POST', body:'Visite demo Haussmann Prestige · '+device+' · '+(navigator.language||'?')});
  }
}catch(e){}

/* ================= INIT ================= */
function init(){
  lang = 'fr';
  document.querySelector('.langbtn[data-lang="fr"]').classList.add('active');
  addBotText(t('welcome'), mainMenuButtons(), 200);
}
init();
</script>
