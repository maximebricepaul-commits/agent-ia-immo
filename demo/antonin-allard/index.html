<style>
:root{
  --navy:#12233a;
  --navy-dark:#0b1626;
  --slate:#26415e;
  --gold:#b08d4f;
  --gold-dark:#8f6f37;
  --stone:#f4f0e9;
  --bg:#f6f2ec;
  --paper:#fffdfa;
  --ink:#22292f;
  --muted:#8a8073;
  --wa:#25d366;
  --wa-dark:#1ebe5b;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1c3452 0%, var(--navy) 55%, var(--navy-dark) 100%);
  min-height:100%;
  display:flex;
  justify-content:center;
  color:var(--ink);
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.35);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 100%);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15.5px;line-height:1.2;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.langbar{display:flex;gap:4px;}
.langbtn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:.3px;
}
.langbtn.active{background:#fff;color:var(--navy);}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(var(--bg),var(--bg));
}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{
  max-width:84%;
  padding:10px 13px;
  border-radius:var(--radius);
  font-size:14.5px;
  line-height:1.45;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.row.bot .bubble{
  background:var(--paper);
  border-bottom-left-radius:4px;
  color:var(--ink);
}
.row.user .bubble{
  background:linear-gradient(135deg,var(--slate),var(--gold));
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble b{color:var(--gold-dark);}
.row.user .bubble b{color:#fff;}

.card{
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  border:1px solid #e7ddcb;
}
.card .cardhead{
  background:linear-gradient(135deg,var(--navy),var(--slate));
  color:#fff;padding:9px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card .cardhead .cname{font-weight:700;font-size:14.5px;}
.card .cardhead .cprice{font-size:12.5px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.card .cardbody{padding:10px 12px;font-size:13.5px;color:var(--ink);}
.dish{padding:7px 0;border-bottom:1px dashed #ece2d0;}
.dish:last-child{border-bottom:none;}
.dish .dname{font-weight:700;color:var(--gold-dark);font-size:13.8px;}
.dish .ddesc{color:var(--muted);font-size:12.5px;margin-top:1px;}
.spec-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;}
.spec{background:var(--bg);color:var(--gold-dark);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{
  background:#fff;
  border:1.5px solid var(--gold);
  color:var(--gold-dark);
  font-size:13px;
  font-weight:600;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:.15s;
}
.qbtn:hover{background:var(--gold);color:#fff;}
.qbtn.primary{background:var(--gold);border-color:var(--gold-dark);color:#fff;}
.qbtn.primary:hover{background:var(--gold-dark);}
.qbtn.wa{background:var(--wa);border-color:var(--wa-dark);color:#fff;}
.qbtn.wa:hover{background:var(--wa-dark);}

.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

/* input bar */
#inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid #ece2d0;
  position:sticky;
  bottom:0;
}
#msgInput{
  flex:1;
  border:1.5px solid #e2d7c4;
  background:var(--bg);
  border-radius:22px;
  padding:11px 16px;
  font-size:14.5px;
  outline:none;
  color:var(--ink);
}
#msgInput:focus{border-color:var(--gold);}
#sendBtn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(143,111,55,.4);
}
#sendBtn:active{transform:scale(.93);}

.footerbadge{
  text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 2px;
  background:var(--paper);
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#dccbb8;border-radius:3px;}
</style>

/* ================= STATE ================= */
let lang = null;
let req = null; // {project, step, sector, type, budget, visit, name, phone}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function t(key){ return (S[lang]||S.fr)[key]; }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(str){
  return esc(str)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  const row = document.createElement('div');
  row.className='row user';
  row.innerHTML = `<div class="bubble">${md(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  const row = document.createElement('div');
  row.className='row bot';
  row.id='typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(()=>{
    row.remove();
    cb();
  }, delay || 550);
}

function addBot(html, buttons){
  const row = document.createElement('div');
  row.className='row bot';
  let btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = `<div class="quick">${buttons.map(b=>`<button class="qbtn ${b.cls||''}" onclick="${b.onclick}">${esc(b.label)}</button>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="stack"><div class="bubble">${html}</div>${btnHtml ? `<div style="margin-top:6px">${btnHtml}</div>` : ''}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addBotText(text, buttons, delay){
  showTyping(()=>addBot(md(text), buttons), delay);
}

/* ================= MENU (navigation) ================= */

  const m = t('menu');
  return [
    {label:m[0], onclick:"startBuy()", cls:"primary"},
    {label:m[1], onclick:"startSell()"},
    {label:m[2], onclick:"startEstimate()"},
    {label:m[3], onclick:"humanHandoff()", cls:"wa"}
  ];
}

function backLabel(){ return "⬅️ "+t('menuLabel'); }

function showMenu(){

}

function startBuy(){

function startSell(){

function pickSector(label){
  addUser(label);
  req.sector = label;
  req.step='type';
  let opts, ask;
  if(req.pkey==='buy'){ opts=t('typeOpts'); ask=t('askType'); }
  else if(req.pkey==='sell'){ opts=t('sellTypeOpts'); ask=t('askSellType'); }
  else { opts=t('estimateTypeOpts'); ask=t('askEstimateType'); }
  addBotText(ask, opts.map(l=>({label:l, onclick:`pickType('${l.replace(/'/g,"\\'")}')`})), 450);
}

function pickType(label){
  addUser(label);
  req.type = label;
  if(req.pkey==='buy'){
    req.step='budget';
    addBotText(t('askBudget'), t('budgetOpts').map(l=>({label:l, onclick:`pickBudget('${l.replace(/'/g,"\\'")}')`})), 450);
  } else if(req.pkey==='estimate'){
    req.step='visit';
    addBotText(t('estimateNote'), null, 400);
    setTimeout(()=>{
      addBotText(t('askVisit'), t('visitOpts').map((l,i)=>({label:l, onclick:`pickVisit(${i})`})), 450);
    }, 850);
  } else {
    req.step='visit';
    addBotText(t('askVisit'), t('visitOpts').map((l,i)=>({label:l, onclick:`pickVisit(${i})`})), 450);
  }
}

function pickBudget(label){
  addUser(label);
  req.budget = label;
  req.step='visit';
  addBotText(t('askVisit'), t('visitOpts').map((l,i)=>({label:l, onclick:`pickVisit(${i})`})), 450);
}

function pickVisit(i){
  const label = t('visitOpts')[i];
  addUser(label);
  req.visit = i===0 ? t('visitVisit') : t('visitAdvice');
  req.step='name';
  addBotText(t('askName'), null, 450);
}

function reqHandleText(text){
  if(!req) return false;
  if(req.step==='name'){
    req.name = text;
    req.step='phone';
    addBotText(t('askPhone').replace('{name}', text), null, 400);
    return true;
  }
  if(req.step==='phone'){
    req.phone = text;
    finishRequest();
    return true;
  }
  return false;
}

function finishRequest(){
  req.step='done';
  showTyping(()=>{
    let rows = `<b>${t('summaryProject')} :</b> ${esc(req.project)}<br>`;
    rows += `<b>${t('summarySector')} :</b> ${esc(req.sector)}<br>`;
    rows += `<b>${t('summaryType')} :</b> ${esc(req.type)}<br>`;
    if(req.budget){ rows += `<b>${t('summaryBudget')} :</b> ${esc(req.budget)}<br>`; }
    rows += `<b>${t('summaryVisit')} :</b> ${esc(req.visit)}<br>`;
    rows += `<b>${t('summaryName')} :</b> ${esc(req.name)}<br>`;
    rows += `<b>${t('summaryPhone')} :</b> ${esc(req.phone)}`;
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">
      <div class="card">
        <div class="cardhead"><span class="cname">${t('summaryTitle')}</span></div>
        <div class="cardbody">
          ${rows}
          <hr style="border:none;border-top:1px solid #ece2d0;margin:8px 0">
          <span style="font-size:12px;color:var(--muted)">${esc(t('summaryFooter'))}</span>
        </div>
      </div></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    let waText = `${t('waPrefix')}\n${t('summaryProject')}: ${req.project}\n${t('summarySector')}: ${req.sector}\n${t('summaryType')}: ${req.type}\n`;
    if(req.budget){ waText += `${t('summaryBudget')}: ${req.budget}\n`; }
    waText += `${t('summaryVisit')}: ${req.visit}\n${t('summaryName')}: ${req.name}\n${t('summaryPhone')}: ${req.phone}`;
    addBot('', [
      {label:t('sendWa'), onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}','_blank')`, cls:'wa'},
      {label:t('newQuery'), onclick:"resetChat()"}
    ]);
    chatEl.lastChild.querySelector('.bubble').style.display='none';
  }, 600);
}

function resetChat(){
  req = null;
  addBotText(t('welcome'), mainMenuButtons(), 300);
}

/* ================= LANGUE ================= */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function detectLang(text){
  const n = normalize(text);
  const fr = ['bonjour','salut','bonsoir','acheter','vendre','estimer','estimation','chalet','appartement','terrain','budget','visite','rendez-vous','megeve','merci','oui','non','bien','maison'];
  const en = ['hello','hi ','hey','buy','sell','value','valuation','chalet','apartment','flat','land','budget','viewing','appointment','thanks','yes','no ','property','house'];
  const es = ['hola','buenas','comprar','vender','valorar','valoracion','chalet','apartamento','terreno','presupuesto','visita','cita','gracias','si','propiedad','casa'];
  const ca = ['hola','bona tarda','comprar','vendre','valorar','valoracio','xalet','apartament','terreny','pressupost','visita','cita','gracies','immoble','casa','voldria'];
  let scores = {fr:0,en:0,es:0,ca:0};
  fr.forEach(w=>{ if(n.includes(w)) scores.fr++; });
  en.forEach(w=>{ if(n.includes(w)) scores.en++; });
  es.forEach(w=>{ if(n.includes(w)) scores.es++; });
  ca.forEach(w=>{ if(n.includes(w)) scores.ca++; });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0 ? best[0] : null;
}

function forceLang(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = '';
  req = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
}

function forceLangSilent(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ================= TEXTE LIBRE ================= */
function normalizedIncludesAny(n, arr){ return arr.some(w=>n.includes(w)); }

function handleFreeText(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value='';

  if(req && (req.step==='name'||req.step==='phone')){
    reqHandleText(text);
    return;
  }

  const n = normalize(text);

  if(normalizedIncludesAny(n,['estim','valor','valuation','value','prix de vente','how much'])){ startEstimate(); return; }
  if(normalizedIncludesAny(n,['vendre','vender','sell','vendel','a vendre','mettre en vente','posar en venda'])){ startSell(); return; }
  if(normalizedIncludesAny(n,['achet','acheter','comprar','buy','recherche','busco','looking for','cerco','busca'])){ startBuy(); return; }
  if(normalizedIncludesAny(n,['secteur','zone','quartier','sector','area','megeve','arbois','rochebrune','combloux'])){ showSectors(); return; }
  if(normalizedIncludesAny(n,['international','etranger','langue','language','idioma','extranjer'])){ showIntl(); return; }
  if(normalizedIncludesAny(n,['accompagn','service','support','acompan','ajuda'])){ showSupport(); return; }
  if(normalizedIncludesAny(n,['bien','biens','listing','property','propiedad','immoble','disponible','portefeuille','chalet','appartement','terrain'])){ showListings(); return; }
  if(normalizedIncludesAny(n,['whatsapp','humain','human','humano','conseiller','asesor','advisor','equipe','equipo','equip','appeler','llamar','call','telephone'])){ humanHandoff(); return; }
  if(normalizedIncludesAny(n,['bonjour','salut','bonsoir','hola','buenas','hello','hi','hey'])){
    addBotText(t('welcome'), mainMenuButtons(), 400); return;
  }

  addBotText(t('fallback'), mainMenuButtons(), 450);
}

function handleSend(){
  const val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){
    const d = detectLang(val) || 'fr';
    forceLangSilent(d);
  }
  handleFreeText(val);
}

inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });
