<style>
:root{
  --navy:#12314f;
  --navy-dark:#0c2338;
  --azure:#1f6fb2;
  --gold:#c9a24b;
  --gold-dark:#a8842f;
  --sky:#3d8dc4;
  --bg:#eef3f7;
  --paper:#ffffff;
  --ink:#1c2a36;
  --muted:#7d8a97;
  --wa:#25d366;
  --wa-dark:#1ebe5b;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #1b4a74 0%, var(--navy) 55%, var(--navy-dark) 100%);
  min-height:100%;
  display:flex;
  justify-content:center;
  color:var(--ink);
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.35);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--azure) 100%);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15.5px;line-height:1.2;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.langbar{display:flex;gap:4px;}
.langbtn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:.3px;
}
.langbtn.active{background:#fff;color:var(--azure);}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(var(--bg),var(--bg));
}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{
  max-width:84%;
  padding:10px 13px;
  border-radius:var(--radius);
  font-size:14.5px;
  line-height:1.45;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.row.bot .bubble{
  background:var(--paper);
  border-bottom-left-radius:4px;
  color:var(--ink);
}
.row.user .bubble{
  background:linear-gradient(135deg,var(--azure),var(--sky));
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble b{color:var(--azure);}
.row.user .bubble b{color:#fff;}

.card{
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  border:1px solid #dbe6ef;
}
.card .cardhead{
  background:linear-gradient(135deg,var(--navy),var(--azure));
  color:#fff;padding:9px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card .cardhead .cname{font-weight:700;font-size:14.5px;}
.card .cardhead .cprice{font-size:12.5px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.card .cardbody{padding:10px 12px;font-size:13.5px;color:var(--ink);}
.listing{padding:7px 0;border-bottom:1px dashed #e2ebf2;}
.listing:last-child{border-bottom:none;}
.listing .lname{font-weight:700;color:var(--azure);font-size:13.8px;}
.listing .ldesc{color:var(--muted);font-size:12.5px;margin-top:1px;}
.spec-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;}
.spec{background:var(--bg);color:var(--azure);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{
  background:#fff;
  border:1.5px solid var(--gold);
  color:var(--gold-dark);
  font-size:13px;
  font-weight:600;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:.15s;
}
.qbtn:hover{background:var(--gold);color:#fff;}
.qbtn.primary{background:var(--gold);border-color:var(--gold-dark);color:#fff;}
.qbtn.primary:hover{background:var(--gold-dark);}
.qbtn.wa{background:var(--wa);border-color:var(--wa-dark);color:#fff;}
.qbtn.wa:hover{background:var(--wa-dark);}

.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

/* input bar */
#inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid #dde7ef;
  position:sticky;
  bottom:0;
}
#msgInput{
  flex:1;
  border:1.5px solid #d3e0ea;
  background:var(--bg);
  border-radius:22px;
  padding:11px 16px;
  font-size:14.5px;
  outline:none;
  color:var(--ink);
}
#msgInput:focus{border-color:var(--azure);}
#sendBtn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(168,132,47,.4);
}
#sendBtn:active{transform:scale(.93);}

.footerbadge{
  text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 2px;
  background:var(--paper);
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#c4d3e0;border-radius:3px;}
</style>

let lang = null;
let flow = null; // {kind:'buy'|'sell'|'estimate', step, sector, type, budget, timing, contact, name, phone}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function t(key){ return (S[lang]||S.fr)[key]; }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(str){
  return esc(str)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

/* single-quote-safe JS string literal for use inside double-quoted onclick attributes */
function q(s){ return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; }

function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  const row = document.createElement('div');
  row.className='row user';
  row.innerHTML = `<div class="bubble">${md(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  const row = document.createElement('div');
  row.className='row bot';
  row.id='typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(()=>{
    row.remove();
    cb();
  }, delay || 550);
}

function addBot(html, buttons){
  const row = document.createElement('div');
  row.className='row bot';
  let btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = `<div class="quick">${buttons.map(b=>`<button class="qbtn ${b.cls||''}" onclick="${b.onclick}">${esc(b.label)}</button>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="stack"><div class="bubble">${html}</div>${btnHtml ? `<div style="margin-top:6px">${btnHtml}</div>` : ''}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addBotText(text, buttons, delay){
  showTyping(()=>addBot(md(text), buttons), delay);
}

function flowContact(label){
  addUser(label);
  flow.contact = label;
  flow.step='name';
  addBotText(t('askName'), null, 450);
}

function flowHandleText(text){
  if(!flow) return false;
  if(flow.step==='name'){
    flow.name = text;
    flow.step='phone';
    addBotText(t('askPhone').replace('{name}', text), null, 400);
    return true;
  }
  if(flow.step==='phone'){
    flow.phone = text;
    finishFlow();
    return true;
  }
  return false;
}

function finishFlow(){
  flow.step='done';
  const titleKey = flow.kind==='buy'?'summaryBuyTitle':(flow.kind==='sell'?'summarySellTitle':'summaryEstTitle');
  const projLabel = flow.kind==='buy'?t('pBuy'):(flow.kind==='sell'?t('pSell'):t('pEstimate'));
  showTyping(()=>{
    let rows = `<b>${t('sProject')} :</b> ${esc(projLabel)}<br><b>${t('sSector')} :</b> ${esc(flow.sector)}<br><b>${t('sType')} :</b> ${esc(flow.type)}<br>`;
    if(flow.kind==='buy') rows += `<b>${t('sBudget')} :</b> ${esc(flow.budget)}<br>`;
    if(flow.kind==='sell') rows += `<b>${t('sTiming')} :</b> ${esc(flow.timing)}<br>`;
    rows += `<b>${t('sContact')} :</b> ${esc(flow.contact)}<br><b>${t('sName')} :</b> ${esc(flow.name)}<br><b>${t('sPhone')} :</b> ${esc(flow.phone)}`;
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">
      <div class="card">
        <div class="cardhead"><span class="cname">${t(titleKey)}</span></div>
        <div class="cardbody">
          ${rows}
          <hr style="border:none;border-top:1px solid #e2ebf2;margin:8px 0">
          <span style="font-size:12px;color:var(--muted)">${esc(t('summaryFooter'))}</span>
        </div>
      </div></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    addBotText(t('disclaimerLegal'), null, 500);
    setTimeout(()=>{
      let waText = `${t('waPrefix')}\n${t('sProject')}: ${projLabel}\n${t('sSector')}: ${flow.sector}\n${t('sType')}: ${flow.type}\n`;
      if(flow.kind==='buy') waText += `${t('sBudget')}: ${flow.budget}\n`;

        {label:t('sendWa'), onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}','_blank')`, cls:'wa'},

/* ================= LANGUE ================= */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function detectLang(text){
  const n = normalize(text);
  const fr = ['bonjour','salut','bonsoir','acheter','vendre','estimer','estimation','appartement','villa','maison','achat','vente','budget','visite','rendez','merci','oui','non','secteur'];
  const en = ['hello','hi ','hey','buy','sell','value','valuation','apartment','villa','house','budget','viewing','appointment','thanks','yes','no ','area','property'];
  const es = ['hola','buenas','comprar','vender','valorar','valoracion','apartamento','villa','casa','presupuesto','visita','cita','gracias','si','no ','zona','propiedad'];
  const ca = ['hola','bona tarda','comprar','vendre','valorar','valoracio','apartament','vila','casa','pressupost','visita','cita','gracies','vespre','zona','voldria'];
  let scores = {fr:0,en:0,es:0,ca:0};
  fr.forEach(w=>{ if(n.includes(w)) scores.fr++; });
  en.forEach(w=>{ if(n.includes(w)) scores.en++; });
  es.forEach(w=>{ if(n.includes(w)) scores.es++; });
  ca.forEach(w=>{ if(n.includes(w)) scores.ca++; });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0 ? best[0] : null;
}

function forceLang(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = '';
  flow = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
}

function forceLangSilent(l){

  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ================= TEXTE LIBRE ================= */
function normalizedIncludesAny(n, arr){ return arr.some(w=>n.includes(w)); }

function handleFreeText(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value='';

  if(flow && (flow.step==='name'||flow.step==='phone')){
    flowHandleText(text);
    return;
  }

  const n = normalize(text);

  if(normalizedIncludesAny(n,['estim','valorar','valorac','valuation','value ','worth'])){ startEstimate(); return; }
  if(normalizedIncludesAny(n,['vendre','vende','vender','sell','venda','vente'])){ startSell(); return; }
  if(normalizedIncludesAny(n,['achet','achat','acheter','buy','comprar','comprend','recherche','cherche','looking','busco'])){ startBuy(); return; }
  if(normalizedIncludesAny(n,['appartement','villa','maison','apartment','apartamento','casa','bien','property','propiedad','terrain'])){ startBuy(); return; }
  if(normalizedIncludesAny(n,['international','etranger','foreign','extranjero','estranger','langue','english','espanol'])){ showIntl(); return; }
  if(normalizedIncludesAny(n,['secteur','zone','quartier','area','sector','barri'])){ showSectors(); return; }
  if(normalizedIncludesAny(n,['agence','contact','adresse','address','llegar','ubicacion','venir','rendez','cita','appointment'])){ showContact(); return; }
  if(normalizedIncludesAny(n,['whatsapp','humain','human','humano','equipe','equipo','equip','conseiller','adviser','asesor','appeler','llamar','call','telephone'])){ humanHandoff(); return; }
  if(normalizedIncludesAny(n,['bonjour','salut','bonsoir','hola','buenas','hello','hi','hey'])){
    addBotText(t('welcome'), mainMenuButtons(), 400); return;
  }

  addBotText(t('fallback'), mainMenuButtons(), 450);
}

function handleSend(){
  const val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){
    const d = detectLang(val) || 'fr';
    forceLangSilent(d);
  }
  handleFreeText(val);
}

inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

try{
  if(location.hash !== '#test'){
    const device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    fetch('https://ntfy.sh/agentia-demo-vieilantibes-t5r7', {method:'POST', body:'Visite demo Vieil Antibes · '+device+' · '+(navigator.language||'?')});
  }
}catch(e){}

function init(){
  lang = 'fr';
  document.querySelector('.langbtn[data-lang="fr"]').classList.add('active');
  addBotText(t('welcome'), mainMenuButtons(), 200);
}
init();
