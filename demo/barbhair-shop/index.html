<title>Alex · Barb'Hair Shop</title>

<style>
:root{
  --ink0:#0e1116;
  --ink1:#161b22;
  --steel:#1f2733;
  --steel2:#2b3543;
  --amber:#c8912f;
  --amber-dark:#a8761f;
  --copper:#d8a24b;
  --bg:#12161d;
  --panel:#eef1f5;
  --paper:#ffffff;
  --ink:#20262e;
  --muted:#8b96a4;
  --wa:#25d366;
  --wa-dark:#1ebe5b;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #232d3a 0%, var(--steel) 45%, var(--ink0) 100%);
  min-height:100%;
  display:flex;
  justify-content:center;
  color:var(--ink);
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--panel);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.5);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--ink1) 0%,var(--steel2) 100%);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 12px rgba(0,0,0,.35);
  border-bottom:2px solid var(--amber);
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--amber),var(--amber-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);
}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15.5px;line-height:1.2;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.langbar{display:flex;gap:4px;}
.langbtn{
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:.3px;
}
.langbtn.active{background:var(--amber);color:var(--ink0);border-color:var(--amber);}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(var(--panel),var(--panel));
}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{
  max-width:84%;
  padding:10px 13px;
  border-radius:var(--radius);
  font-size:14.5px;
  line-height:1.45;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.row.bot .bubble{
  background:var(--paper);
  border-bottom-left-radius:4px;
  color:var(--ink);
}
.row.user .bubble{
  background:linear-gradient(135deg,var(--steel2),var(--amber-dark));
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble b{color:var(--amber-dark);}
.row.user .bubble b{color:#fff;}

.card{
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
  border:1px solid #dfe4ea;
}
.card .cardhead{
  background:linear-gradient(135deg,var(--ink1),var(--steel2));
  color:#fff;padding:9px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:2px solid var(--amber);
}
.card .cardhead .cname{font-weight:700;font-size:14.5px;}
.card .cardhead .cprice{font-size:12.5px;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.card .cardbody{padding:10px 12px;font-size:13.5px;color:var(--ink);}
.dish{padding:7px 0;border-bottom:1px dashed #e6eaef;}
.dish:last-child{border-bottom:none;}
.dish .dname{font-weight:700;color:var(--steel2);font-size:13.8px;display:flex;justify-content:space-between;gap:8px;}
.dish .dprice{color:var(--amber-dark);font-weight:700;font-size:12.8px;white-space:nowrap;}
.dish .ddesc{color:var(--muted);font-size:12.5px;margin-top:1px;}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{
  background:#fff;
  border:1.5px solid var(--amber);
  color:var(--amber-dark);
  font-size:13px;
  font-weight:600;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:.15s;
}
.qbtn:hover{background:var(--amber);color:var(--ink0);}
.qbtn.primary{background:var(--amber);border-color:var(--amber-dark);color:var(--ink0);}
.qbtn.primary:hover{background:var(--amber-dark);color:#fff;}
.qbtn.wa{background:var(--wa);border-color:var(--wa-dark);color:#fff;}
.qbtn.wa:hover{background:var(--wa-dark);}

.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

/* input bar */
#inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid #e2e7ec;
  position:sticky;
  bottom:0;
}
#msgInput{
  flex:1;
  border:1.5px solid #d7dde4;
  background:var(--panel);
  border-radius:22px;
  padding:11px 16px;
  font-size:14.5px;
  outline:none;
  color:var(--ink);
}
#msgInput:focus{border-color:var(--amber);}
#sendBtn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--amber),var(--amber-dark));
  color:var(--ink0);font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(168,118,31,.4);
}
#sendBtn:active{transform:scale(.93);}

.footerbadge{
  text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 2px;
  background:var(--paper);
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#c9d1da;border-radius:3px;}
</style>

  menuIntro:"Ecco uno sguardo ai nostri servizi principali ✂️ (durate e prezzi indicativi):",
  menuCardTitle:"I nostri servizi",

  vegLine:"💈 Hai dubbi? Dimmi cosa cerchi (taglio, barba, rasatura, sfumatura) e ti indirizzo al servizio giusto.",
  menuButtons:["🎓 Studenti e pacchetti","💈 Prenota","⬅️ Menu"],
  allergyLine:"🧴 *Pelle sensibile o preferenze*: dimmi le tue sensibilità (prodotti, profumi, tipo di rasatura…) e le passo al barbiere con il tuo appuntamento, per adattare i trattamenti e i prodotti.",

  faqTitle:"Cosa vuoi sapere?",
  faqButtons:["🧴 Pelle sensibile e prodotti","🎓 Studenti e pacchetti","📍 Come arrivare","⬅️ Menu"],
  humanHandoff:"Certo — ti metto in contatto diretto con il team di Barb'Hair Shop 👇",
  fallback:"Bella domanda! Posso aiutarti a *prenotare*, vedere *i servizi* o gli *orari* — oppure ti passo il team. Cosa preferisci?",
  langSwitched:"Passato all'italiano 🇮🇹"
}
};

/* ================= STATE ================= */
let lang = null;
let booking = null; // {step, service, date, slot, name, phone}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function t(key){ return (S[lang]||S.fr)[key]; }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(str){
  return esc(str)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  const row = document.createElement('div');
  row.className='row user';
  row.innerHTML = `<div class="bubble">${md(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  const row = document.createElement('div');
  row.className='row bot';
  row.id='typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(()=>{
    row.remove();
    cb();
  }, delay || 550);
}

function addBot(html, buttons){
  const row = document.createElement('div');
  row.className='row bot';
  let btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = `<div class="quick">${buttons.map(b=>`<button class="qbtn ${b.cls||''}" onclick="${b.onclick}">${esc(b.label)}</button>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="stack"><div class="bubble">${html}</div>${btnHtml ? `<div style="margin-top:6px">${btnHtml}</div>` : ''}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addBotText(text, buttons, delay){
  showTyping(()=>addBot(md(text), buttons), delay);
}

/* ================= MENU (navigation) ================= */
function mainMenuButtons(){
  const m = t('menu');
  return [
    {label:m[0], onclick:"startBooking()", cls:"primary"},
    {label:m[1], onclick:"showCarte()"},
    {label:m[2], onclick:"showHours()"},
    {label:m[3], onclick:"humanHandoff()", cls:"wa"}
  ];
}

function backLabel(){ return "⬅️ "+t('menuLabel'); }

function showMenu(){
  addBotText(t('welcome').split('\n').slice(1).join('\n') || t('welcome'), mainMenuButtons(), 300);
}

/* ================= PRESTATIONS ================= */
function carteCardHtml(){
  let body = '';
  SERVICES.forEach(d=>{
    body += `<div class="dish"><div class="dname"><span>${esc(d.name[lang])}</span><span class="dprice">${esc(d.price)}</span></div><div class="ddesc">${esc(d.desc[lang])}</div></div>`;
  });
  return `
  <div class="card">
    <div class="cardhead"><span class="cname">✂️ ${t('menuCardTitle')}</span><span class="cprice">${t('menuCardPrice')}</span></div>
    <div class="cardbody">
      ${body}
      <div class="demo-note">ℹ️ ${esc(t('menuDemoNote'))}</div>
    </div>
  </div>`;
}

function showCarte(){
  addUser(t('menu')[1]);
  addBotText(t('menuIntro'), null, 400);
  setTimeout(()=>{
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">${carteCardHtml()}</div>`;
    chatEl.appendChild(row);
    scrollBottom();
    addBot(md(t('vegLine')), t('menuButtons').map((label,i)=>{
      const acts = ["showGifts()","startBooking()","showMenu()"];
      return {label, onclick:acts[i], cls: i===1?'primary':''};
    }));
  }, 700);
}

function showAllergies(){
  addUser(t('faqButtons')[0]);
  addBotText(t('allergyLine'), [
    {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 450);
}

function showGifts(){
  addUser(t('menuButtons')[0]);
  addBotText(t('giftLine'), [
    {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
    {label:"💬 WhatsApp", onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t('waPrefix'))}','_blank')`, cls:'wa'}
  ], 450);
}

/* ================= HORAIRES & ACCÈS ================= */
function showHours(){
  addUser(t('menu')[2]);
  addBotText(t('faqTitle'), t('faqButtons').map((label,i)=>{
    const keys=['allergy','gifts','access','menu'];
    const map={allergy:"showAllergies()",gifts:"showGifts()",access:"showAccess()",menu:"showMenu()"};
    return {label, onclick: map[keys[i]]};
  }), 350);
  setTimeout(()=>{
    addBot(md(t('hoursText')+"\n\n"+t('accessText')), [
      {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
      {label:backLabel(), onclick:"showMenu()"}
    ]);
  }, 900);
}

function showAccess(){
  addUser(t('faqButtons')[2]);
  addBotText(t('accessText'), [
    {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

/* ================= HANDOFF HUMAIN ================= */
function humanHandoff(){
  addUser(t('menu')[3]);
  addBotText(t('humanHandoff'), [
    {label:"💬 WhatsApp", onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t('waPrefix'))}','_blank')`, cls:'wa'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

/* ================= RENDEZ-VOUS ================= */
function startBooking(){
  addUser(t('menu')[0]);
  booking = {step:'service', service:null, date:null, slot:null, name:null, phone:null};
  addBotText(t('bookStart'), null, 300);
  setTimeout(()=>{
    addBotText(t('askService'), t('serviceOpts').map(l=>({label:l, onclick:`bookingService('${l.replace(/'/g,"\\'")}')`})));
  }, 700);
}

function bookingService(label){
  addUser(label);
  booking.service = label;
  booking.step='date';
  addBotText(t('askDate'), t('dateOpts').map(l=>({label:l, onclick:`bookingDate('${l.replace(/'/g,"\\'")}')`})), 450);
}

function bookingDate(label){
  addUser(label);
  booking.date = label;
  booking.step='slot';
  addBotText(t('askSlot'), t('slotOpts').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
}

function bookingSlot(label){
  addUser(label);
  booking.slot = label;
  booking.step='name';
  addBotText(t('askName'), null, 450);
}

function bookingHandleText(text){
  if(!booking) return false;
  if(booking.step==='service'){
    booking.service = text;
    booking.step='date';
    addBotText(t('askDate'), t('dateOpts').map(l=>({label:l, onclick:`bookingDate('${l.replace(/'/g,"\\'")}')`})), 450);
    return true;
  }
  if(booking.step==='date'){
    booking.date = text;
    booking.step='slot';
    addBotText(t('askSlot'), t('slotOpts').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
    return true;
  }
  if(booking.step==='name'){
    booking.name = text;
    booking.step='phone';
    addBotText(t('askPhone').replace('{name}', text), null, 400);
    return true;
  }
  if(booking.step==='phone'){
    booking.phone = text;
    finishBooking();
    return true;
  }
  return false;
}

function finishBooking(){
  booking.step='done';
  showTyping(()=>{
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">
      <div class="card">
        <div class="cardhead"><span class="cname">${t('summaryTitle')}</span></div>
        <div class="cardbody">
          <b>${t('summaryService')} :</b> ${esc(booking.service)}<br>
          <b>${t('summaryDate')} :</b> ${esc(booking.date)}<br>
          <b>${t('summarySlot')} :</b> ${esc(booking.slot)}<br>
          <b>${t('summaryName')} :</b> ${esc(booking.name)}<br>
          <b>${t('summaryPhone')} :</b> ${esc(booking.phone)}
          <hr style="border:none;border-top:1px solid #e6eaef;margin:8px 0">
          <span style="font-size:12px;color:var(--muted)">${esc(t('summaryFooter'))}</span>
        </div>
      </div></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    const waText = `${t('waPrefix')}\n${t('summaryService')}: ${booking.service}\n${t('summaryDate')}: ${booking.date}\n${t('summarySlot')}: ${booking.slot}\n${t('summaryName')}: ${booking.name}\n${t('summaryPhone')}: ${booking.phone}`;
    addBot('', [
      {label:t('sendWa'), onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}','_blank')`, cls:'wa'},
      {label:t('newQuery'), onclick:"resetChat()"}
    ]);
    chatEl.lastChild.querySelector('.bubble').style.display='none';
  }, 600);
}

function resetChat(){
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 300);
}

/* ================= LANGUE ================= */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function detectLang(text){
  const n = normalize(text);
  const fr = ['bonjour','salut','bonsoir','rendez','rdv','coupe','barbe','rasage','degrade','horaire','merci','oui','non','prendre','reserver'];
  const en = ['hello','hi ','hey','appointment','booking','haircut','beard','shave','fade','hours','thanks','yes','no ','book'];
  const es = ['hola','buenas','cita','corte','barba','afeitado','degradado','horario','gracias','si','no ','reservar','servicio'];
  const it = ['ciao','buongiorno','buonasera','prenot','taglio','barba','rasatura','sfumatura','orari','grazie','vorrei','servizio'];
  let scores = {fr:0,en:0,es:0,it:0};
  fr.forEach(w=>{ if(n.includes(w)) scores.fr++; });
  en.forEach(w=>{ if(n.includes(w)) scores.en++; });
  es.forEach(w=>{ if(n.includes(w)) scores.es++; });
  it.forEach(w=>{ if(n.includes(w)) scores.it++; });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0 ? best[0] : null;
}

function forceLang(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = '';
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
}

function forceLangSilent(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ================= TEXTE LIBRE ================= */
function normalizedIncludesAny(n, arr){ return arr.some(w=>n.includes(w)); }

function handleFreeText(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value='';

  if(booking && (booking.step==='service'||booking.step==='date'||booking.step==='name'||booking.step==='phone')){
    bookingHandleText(text);
    return;
  }

  const n = normalize(text);

  if(normalizedIncludesAny(n,['rendez','rdv','reserv','appointment','book','cita','prendre','pedir','prenot'])){ startBooking(); return; }
  if(normalizedIncludesAny(n,['prestation','service','servizio','servicio','coupe','barbe','rasage','degrade','haircut','beard','shave','fade','corte','afeitado','taglio','rasatura','sfumatura'])){
    if(normalizedIncludesAny(n,['sensible','sensitive','peau','piel','skin','pelle','produit','product','producto','prodotto'])){ showAllergies(); return; }
    showCarte(); return;
  }
  if(normalizedIncludesAny(n,['sensible','sensitive','peau','piel','skin','pelle','produit','product','producto','prodotto'])){ showAllergies(); return; }
  if(normalizedIncludesAny(n,['horaire','horari','horario','orari','hour','ouvert','abierto','open','aperto','ferme','chiuso','cerrado'])){ showHours(); return; }
  if(normalizedIncludesAny(n,['acces','acceso','direction','parking','venir','llegar','arrivare','arrivo','adresse','address','indirizzo','carnot'])){ showAccess(); return; }
  if(normalizedIncludesAny(n,['etudiant','student','estudiante','studente','forfait','package','pack','fidelite','loyalty','fedelta','fidelidad','abonnement'])){ showGifts(); return; }
  if(normalizedIncludesAny(n,['whatsapp','humain','human','humano','umano','equipe','equipo','team','appeler','llamar','call','chiamare','telephone'])){ humanHandoff(); return; }
  if(normalizedIncludesAny(n,['bonjour','salut','bonsoir','hola','buenas','hello','hi','hey','ciao','buongiorno'])){
    addBotText(t('welcome'), mainMenuButtons(), 400); return;
  }

  addBotText(t('fallback'), mainMenuButtons(), 450);
}

function handleSend(){
  const val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){
    const d = detectLang(val) || 'fr';
    forceLangSilent(d);
  }
  handleFreeText(val);
}

inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

/* ================= VISIT PING ================= */
try{
  if(location.hash !== '#test'){
    const device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    fetch('https://ntfy.sh/agentia-demo-barbhaircannes-h9d5', {method:'POST', body:'Visite demo Barb Hair · '+device+' · '+(navigator.language||'?')});
  }
}catch(e){}

/* ================= INIT ================= */
function init(){
  lang = 'fr';
  document.querySelector('.langbtn[data-lang="fr"]').classList.add('active');
  addBotText(t('welcome'), mainMenuButtons(), 200);
}
init();
</script>
