<title>Alex · Notaría Vázquez Moral</title>

<style>
:root{
  --navy:#1c2b4a;
  --navy-dark:#121d33;
  --slate:#2f4368;
  --gold:#a9863f;
  --gold-dark:#8c6d2c;
  --bg:#f3f0e8;
  --paper:#fffdf8;
  --ink:#232b38;
  --muted:#7d7768;
  --wa:#25d366;
  --wa-dark:#1ebe5b;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, #2c4066 0%, var(--navy) 55%, var(--navy-dark) 100%);
  min-height:100%;
  display:flex;
  justify-content:center;
  color:var(--ink);
}
#app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.35);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--navy) 0%,var(--slate) 100%);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.hinfo{flex:1;min-width:0;}
.hinfo .name{font-weight:700;font-size:15px;line-height:1.2;}
.hinfo .status{font-size:12px;opacity:.85;display:flex;align-items:center;gap:5px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 2px rgba(74,222,128,.3);}
.langbar{display:flex;gap:4px;}
.langbtn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:5px 7px;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:.3px;
}
.langbtn.active{background:#fff;color:var(--navy);}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(var(--bg),var(--bg));
}
.row{display:flex;width:100%;}
.row.bot{justify-content:flex-start;}
.row.user{justify-content:flex-end;}
.stack{display:flex;flex-direction:column;max-width:88%;}
.row.bot .stack{align-items:flex-start;}
.row.user .stack{align-items:flex-end;}
.bubble{
  max-width:84%;
  padding:10px 13px;
  border-radius:var(--radius);
  font-size:14.5px;
  line-height:1.45;
  white-space:pre-wrap;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.row.bot .bubble{
  background:var(--paper);
  border-bottom-left-radius:4px;
  color:var(--ink);
}
.row.user .bubble{
  background:linear-gradient(135deg,var(--slate),var(--navy));
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble b{color:var(--navy);}
.row.user .bubble b{color:#fff;}

.card{
  background:var(--paper);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  border:1px solid #e7e0d2;
}
.card .cardhead{
  background:linear-gradient(135deg,var(--navy),var(--slate));
  color:#fff;padding:9px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.card .cardhead .cname{font-weight:700;font-size:14.5px;}
.card .cardhead .cprice{font-size:12px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:20px;white-space:nowrap;}
.card .cardbody{padding:10px 12px;font-size:13.5px;color:var(--ink);}
.dish{padding:7px 0;border-bottom:1px dashed #ece5d6;}
.dish:last-child{border-bottom:none;}
.dish .dname{font-weight:700;color:var(--navy);font-size:13.8px;}
.dish .ddesc{color:var(--muted);font-size:12.5px;margin-top:1px;}
.spec-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;}
.spec{background:var(--bg);color:var(--gold-dark);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:20px;}
.demo-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}

/* quick replies */
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
.qbtn{
  background:#fff;
  border:1.5px solid var(--gold);
  color:var(--gold-dark);
  font-size:13px;
  font-weight:600;
  padding:8px 12px;
  border-radius:20px;
  cursor:pointer;
  transition:.15s;
}
.qbtn:hover{background:var(--gold);color:#fff;}
.qbtn.primary{background:var(--navy);border-color:var(--navy-dark);color:#fff;}
.qbtn.primary:hover{background:var(--navy-dark);}
.qbtn.wa{background:var(--wa);border-color:var(--wa-dark);color:#fff;}
.qbtn.wa:hover{background:var(--wa-dark);}

.typing{display:flex;gap:4px;padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.5;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

/* input bar */
#inputbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--paper);
  border-top:1px solid #ece5d6;
  position:sticky;
  bottom:0;
}
#msgInput{
  flex:1;
  border:1.5px solid #e2dac9;
  background:var(--bg);
  border-radius:22px;
  padding:11px 16px;
  font-size:14.5px;
  outline:none;
  color:var(--ink);
}
#msgInput:focus{border-color:var(--gold);}
#sendBtn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(140,109,44,.4);
}
#sendBtn:active{transform:scale(.93);}

.footerbadge{
  text-align:center;font-size:10.5px;color:var(--muted);padding:6px 0 2px;
  background:var(--paper);
}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#d6cdba;border-radius:3px;}
</style>

  slotOpts:["9:30 am","11:00 am","4:30 pm"],
  askName:"🙋 What name should I put the appointment under?",
  askPhone:"📱 Great, {name}! A mobile number so I can send you the confirmation (and a reminder the day before)?",
  summaryTitle:"📋 Your appointment summary",
  summaryTramite:"Matter", summaryDate:"Date", summarySlot:"Time", summaryName:"Name", summaryPhone:"Phone",
  summaryFooter:"✅ I'm passing your request to the Notaría Vázquez Moral team, who will confirm the appointment and tell you which documents to bring. 🔔 You'll get a reminder the day before so nothing slips your mind.",
  sendWa:"📲 Send my appointment via WhatsApp",
  newQuery:"🔄 New request",
  waPrefix:"Hi! I'd like to book an appointment at the Notaría Vázquez Moral:",
  tramiteIntro:"Here are the most common matters. Pick yours to book an appointment, and the office will tell you the exact documents 📁:",
  tramiteCardTitle:"Common matters",

  tramiteDemoNote:"Illustrative information for demonstration — the office will confirm the documents and requirements for your specific case.",
  tramiteButtons:["📅 Book an appointment","⬅️ Menu"],

  docsText:"📄 *Documents*: tell me your matter (sale, inheritance, power of attorney…) and I'll guide you on what's usually needed. The final list is confirmed by the team, who reviews each case.",
  faqTitle:"What would you like to know?",
  faqButtons:["📄 Documents","📁 Matters","📍 Address","⬅️ Menu"],
  humanHandoff:"Of course — I'll connect you directly with the Notaría Vázquez Moral team 👇",
  fallback:"Good question. I can help you *book an appointment*, guide you on the *type of matter* or give you the *hours* — or I can hand you to the team. Note that I don't give legal advice. What would you prefer?",
  langSwitched:"Switched to English 🇬🇧"
}
};

/* ================= STATE ================= */
let lang = null;
let booking = null; // {step, tramite, date, slot, name, phone}
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('msgInput');

function t(key){ return (S[lang]||S.es)[key]; }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(str){
  return esc(str)
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}

function scrollBottom(){ requestAnimationFrame(()=>{ chatEl.scrollTop = chatEl.scrollHeight; }); }

function addUser(text){
  const row = document.createElement('div');
  row.className='row user';
  row.innerHTML = `<div class="bubble">${md(text)}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function showTyping(cb, delay){
  const row = document.createElement('div');
  row.className='row bot';
  row.id='typingRow';
  row.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl.appendChild(row);
  scrollBottom();
  setTimeout(()=>{
    row.remove();
    cb();
  }, delay || 550);
}

function addBot(html, buttons){
  const row = document.createElement('div');
  row.className='row bot';
  let btnHtml = '';
  if(buttons && buttons.length){
    btnHtml = `<div class="quick">${buttons.map(b=>`<button class="qbtn ${b.cls||''}" onclick="${b.onclick}">${esc(b.label)}</button>`).join('')}</div>`;
  }
  row.innerHTML = `<div class="stack"><div class="bubble">${html}</div>${btnHtml ? `<div style="margin-top:6px">${btnHtml}</div>` : ''}</div>`;
  chatEl.appendChild(row);
  scrollBottom();
}

function addBotText(text, buttons, delay){
  showTyping(()=>addBot(md(text), buttons), delay);
}

/* ================= MENU (navigation) ================= */
function mainMenuButtons(){
  const m = t('menu');
  return [
    {label:m[0], onclick:"startBooking()", cls:"primary"},
    {label:m[1], onclick:"showTramites()"},
    {label:m[2], onclick:"showHours()"},
    {label:m[3], onclick:"humanHandoff()", cls:"wa"}
  ];
}

function backLabel(){ return "⬅️ "+t('menuLabel'); }

function showMenu(){
  addBotText(t('welcome').split('\n').slice(1).join('\n') || t('welcome'), mainMenuButtons(), 300);
}

/* ================= TRÁMITES ================= */
function tramiteCardHtml(){
  let body = '';
  TRAMITES.forEach(tr=>{
    body += `<div class="dish"><div class="dname">${tr.icon} ${esc(tr.name[lang])}</div><div class="ddesc">${esc(tr.desc[lang])}</div></div>`;
  });
  return `
  <div class="card">
    <div class="cardhead"><span class="cname">📁 ${t('tramiteCardTitle')}</span><span class="cprice">${t('tramiteCardTag')}</span></div>
    <div class="cardbody">
      ${body}
      <div class="demo-note">ℹ️ ${esc(t('tramiteDemoNote'))}</div>
    </div>
  </div>`;
}

function showTramites(){
  addUser(t('menu')[1]);
  addBotText(t('tramiteIntro'), null, 400);
  setTimeout(()=>{
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">${tramiteCardHtml()}</div>`;
    chatEl.appendChild(row);
    scrollBottom();
    addBot(md(t('docLine')), t('tramiteButtons').map((label,i)=>{
      const acts = ["startBooking()","showMenu()"];
      return {label, onclick:acts[i], cls: i===0?'primary':''};
    }));
  }, 700);
}

/* ================= HORARIO Y DIRECCIÓN ================= */
function showHours(){
  addUser(t('menu')[2]);
  addBotText(t('faqTitle'), t('faqButtons').map((label,i)=>{
    const keys=['docs','tramites','access','menu'];
    const map={docs:"showDocs()",tramites:"showTramites()",access:"showAccess()",menu:"showMenu()"};
    return {label, onclick: map[keys[i]]};
  }), 350);
  setTimeout(()=>{
    addBot(md(t('hoursText')+"\n\n"+t('accessText')), [
      {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
      {label:backLabel(), onclick:"showMenu()"}
    ]);
  }, 900);
}

function showAccess(){
  addUser(t('faqButtons')[2]);
  addBotText(t('accessText'), [
    {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

function showDocs(){
  addUser(t('faqButtons')[0]);
  addBotText(t('docsText'), [
    {label:t('menu')[0], onclick:"startBooking()", cls:'primary'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 450);
}

/* ================= HANDOFF HUMANO ================= */
function humanHandoff(){
  addUser(t('menu')[3]);
  addBotText(t('humanHandoff'), [
    {label:"💬 WhatsApp", onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t('waPrefix'))}','_blank')`, cls:'wa'},
    {label:backLabel(), onclick:"showMenu()"}
  ], 400);
}

/* ================= CITA / PRISE DE RDV ================= */
function startBooking(){
  addUser(t('menu')[0]);
  booking = {step:'tramite', tramite:null, date:null, slot:null, name:null, phone:null};
  addBotText(t('bookStart'), null, 300);
  setTimeout(()=>{
    addBotText(t('askTramite'), t('tramiteOpts').map(l=>({label:l, onclick:`bookingTramite('${l.replace(/'/g,"\\'")}')`})));
  }, 700);
}

function bookingTramite(label){
  addUser(label);
  booking.tramite = label;
  booking.step='date';
  addBotText(t('askDate'), t('dateOpts').map(l=>({label:l, onclick:`bookingDate('${l.replace(/'/g,"\\'")}')`})), 450);
}

function bookingDate(label){
  addUser(label);
  booking.date = label;
  booking.step='slot';
  addBotText(t('askSlot'), t('slotOpts').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
}

function bookingSlot(label){
  addUser(label);
  booking.slot = label;
  booking.step='name';
  addBotText(t('askName'), null, 450);
}

function bookingHandleText(text){
  if(!booking) return false;
  if(booking.step==='date'){
    booking.date = text;
    booking.step='slot';
    addBotText(t('askSlot'), t('slotOpts').map(l=>({label:l, onclick:`bookingSlot('${l.replace(/'/g,"\\'")}')`})), 450);
    return true;
  }
  if(booking.step==='name'){
    booking.name = text;
    booking.step='phone';
    addBotText(t('askPhone').replace('{name}', text), null, 400);
    return true;
  }
  if(booking.step==='phone'){
    booking.phone = text;
    finishBooking();
    return true;
  }
  return false;
}

function finishBooking(){
  booking.step='done';
  showTyping(()=>{
    const row = document.createElement('div');
    row.className='row bot';
    row.innerHTML = `<div class="bubble" style="padding:0;background:transparent;box-shadow:none;max-width:94%">
      <div class="card">
        <div class="cardhead"><span class="cname">${t('summaryTitle')}</span></div>
        <div class="cardbody">
          <b>${t('summaryTramite')} :</b> ${esc(booking.tramite)}<br>
          <b>${t('summaryDate')} :</b> ${esc(booking.date)}<br>
          <b>${t('summarySlot')} :</b> ${esc(booking.slot)}<br>
          <b>${t('summaryName')} :</b> ${esc(booking.name)}<br>
          <b>${t('summaryPhone')} :</b> ${esc(booking.phone)}
          <hr style="border:none;border-top:1px solid #ece5d6;margin:8px 0">
          <span style="font-size:12px;color:var(--muted)">${esc(t('summaryFooter'))}</span>
        </div>
      </div></div>`;
    chatEl.appendChild(row);
    scrollBottom();
    const waText = `${t('waPrefix')}\n${t('summaryTramite')}: ${booking.tramite}\n${t('summaryDate')}: ${booking.date}\n${t('summarySlot')}: ${booking.slot}\n${t('summaryName')}: ${booking.name}\n${t('summaryPhone')}: ${booking.phone}`;
    addBot('', [
      {label:t('sendWa'), onclick:`window.open('https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(waText)}','_blank')`, cls:'wa'},
      {label:t('newQuery'), onclick:"resetChat()"}
    ]);
    chatEl.lastChild.querySelector('.bubble').style.display='none';
  }, 600);
}

function resetChat(){
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 300);
}

/* ================= IDIOMA ================= */
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function detectLang(text){
  const n = normalize(text);
  const es = ['hola','buenas','cita','tramite','compraventa','herencia','poder','notaria','horario','direccion','gracias','si','documento','escritura'];
  const ca = ['hola','bon dia','cita','tramit','compravenda','herencia','poder','notaria','horari','adreca','gracies','document','escriptura','voldria'];
  const fr = ['bonjour','salut','bonsoir','rendez','rdv','vente','succession','procuration','notaire','horaire','adresse','merci','oui','document'];
  const en = ['hello','hi ','hey','appointment','sale','inheritance','power of attorney','notary','hours','address','thanks','yes','document','deed'];
  let scores = {es:0,ca:0,fr:0,en:0};
  es.forEach(w=>{ if(n.includes(w)) scores.es++; });
  ca.forEach(w=>{ if(n.includes(w)) scores.ca++; });
  fr.forEach(w=>{ if(n.includes(w)) scores.fr++; });
  en.forEach(w=>{ if(n.includes(w)) scores.en++; });
  const best = Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0 ? best[0] : null;
}

function forceLang(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
  chatEl.innerHTML = '';
  booking = null;
  addBotText(t('welcome'), mainMenuButtons(), 250);
  setTimeout(()=>addBot(md(t('disclaimer'))), 900);
}

function forceLangSilent(l){
  lang = l;
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('active', b.dataset.lang===l));
  document.getElementById('statusTxt').textContent = t('status');
  inputEl.placeholder = t('placeholder');
}

/* ================= TEXTO LIBRE ================= */
function normalizedIncludesAny(n, arr){ return arr.some(w=>n.includes(w)); }

function handleFreeText(raw){
  const text = raw.trim();
  if(!text) return;
  addUser(text);
  inputEl.value='';

  if(booking && (booking.step==='date'||booking.step==='name'||booking.step==='phone')){
    bookingHandleText(text);
    return;
  }

  const n = normalize(text);

  if(normalizedIncludesAny(n,['cita','rendez','rdv','appointment','reserv','agenda'])){ startBooking(); return; }
  if(normalizedIncludesAny(n,['tramite','tramit','dossier','matter','compraventa','compravenda','vente','sale','herencia','succession','inheritance','poder','procuration','power','escritura','deed'])){ showTramites(); return; }
  if(normalizedIncludesAny(n,['document','documentacion','documentacio','papel','papier','aportar','bring'])){ showDocs(); return; }
  if(normalizedIncludesAny(n,['horario','horari','horaire','hour','abierto','obert','ouvert','open','cerrado','tancat','ferme'])){ showHours(); return; }
  if(normalizedIncludesAny(n,['direccion','adreca','adresse','address','parking','aparcamiento','llegar','venir','arribar','como llego'])){ showAccess(); return; }
  if(normalizedIncludesAny(n,['whatsapp','humano','huma','humain','human','persona','equipo','equip','equipe','team','llamar','telefono','appeler','call','notario','notari','notaire','notary'])){ humanHandoff(); return; }
  if(normalizedIncludesAny(n,['hola','buenas','bon dia','bonjour','salut','bonsoir','hello','hi','hey'])){
    addBotText(t('welcome'), mainMenuButtons(), 400); return;
  }

  addBotText(t('fallback'), mainMenuButtons(), 450);
}

function handleSend(){
  const val = inputEl.value;
  if(!val.trim()) return;
  if(!lang){
    const d = detectLang(val) || 'es';
    forceLangSilent(d);
  }
  handleFreeText(val);
}

inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

/* ================= VISIT PING ================= */
try{
  if(location.hash !== '#test'){
    const device = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' : 'desktop';
    fetch('https://ntfy.sh/agentia-demo-notariavazquez-x2n8', {method:'POST', body:'Visite demo Notaria Vazquez · '+device+' · '+(navigator.language||'?')});
  }
}catch(e){}

/* ================= INIT ================= */
function init(){
  lang = 'es';
  document.querySelector('.langbtn[data-lang="es"]').classList.add('active');
  addBotText(t('welcome'), mainMenuButtons(), 200);
  setTimeout(()=>addBot(md(t('disclaimer'))), 1100);
}
init();
</script>
